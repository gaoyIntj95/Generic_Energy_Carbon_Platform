<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-logo"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="16" rx="3" stroke="white" stroke-width="1.8"/><path d="M8 9h2v5H8zm3-2h2v7h-2zm3 3h2v4h-2z" fill="white"/><path d="M7 17h10" stroke="white" stroke-width="1.6"/></svg></div><span>通用能碳平台</span></div>
    <div class="nav">
      <div class="nav-group-title"><div class="nav-left"><span class="nav-icon">◈</span><span>能碳资产运营与策略</span></div><span>⌄</span></div>
      <div class="submenu">
        <button class="nav-item active" data-page="balance">能效平衡与优化</button>
        <button class="nav-item" data-page="analysis">用能分析与策略推荐</button>
        <button class="nav-item" data-page="budget">用能与碳排放预算管理</button>

      <div class="top-actions"><button class="icon-btn">♧</button><button class="icon-btn">▥</button><button class="icon-btn">?</button><button class="icon-btn">♟<span class="badge">12</span></button><div class="avatar">人</div><span>管理员⌄</span></div>

<script>
const state={page:'balance',budgetTab:'energy',period:'month'};
const pages=document.getElementById('pages');
function iconCircle(symbol){return `<span class="kpi-icon">${symbol}</span>`}
function filterHtml(opts={}){return `<div class="card filter-card">
  ${opts.period!==false?`<div class="field"><label>分析周期</label><div class="segment"><button class="${state.period==='month'?'active':''}" onclick="setPeriod('month')">月度</button><button class="${state.period==='year'?'active':''}" onclick="setPeriod('year')">年度</button></div></div>`:''}
  <div class="field"><label>${opts.periodLabel||'年份'}</label><select><option>2026年</option><option>2025年</option></select></div>
  ${opts.month!==false?`<div class="field month-field"><label>月份</label><select><option>6月</option><option>5月</option><option>4月</option></select></div>`:''}
  <div class="field"><label>统计范围</label><select><option>全企业</option><option>生产单元A</option><option>生产单元B</option><option>公辅系统</option></select></div>
  ${opts.compare?`<div class="field"><label>对比口径</label><select><option>同比</option><option>环比</option></select></div>`:''}
  <div class="spacer"></div><button class="btn btn-primary" onclick="toast('查询条件已更新')">查询</button><button class="btn btn-gray" onclick="toast('已重置查询条件')">重置</button>${opts.more||''}</div>`}
function kpiCard(label,value,unit,sub='',cls='',icon=''){return `<div class="card kpi-card ${cls}">${icon?iconCircle(icon):''}<div class="kpi-label">${label}</div><div class="kpi-value ${cls.includes('soft-red')?'red':''}">${value}<span class="kpi-unit">${unit}</span></div><div class="kpi-sub">${sub}</div></div>`}
function balancePage(){

function lineChart(carbon=false){const actual=carbon?[12,21,29,36,44,51]:[20,31,41,50,59,68];const forecast=carbon?[51,61,71,80,89,99.5]:[68,78,88,98,108,118,130];const max=carbon?120:160,target=carbon?95:120;const W=1000,H=260,padL=60,padR=25,padT=25,padB=35;function pt(v,i,n,start=0){const x=padL+(W-padL-padR)*(start+i)/(11);const y=padT+(H-padT-padB)*(1-v/max);return [x,y]}const actualPts=actual.map((v,i)=>pt(v,i,actual.length)).map(p=>p.join(',')).join(' ');const forePts=forecast.map((v,i)=>pt(v,i,forecast.length,5)).map(p=>p.join(',')).join(' ');const ty=padT+(H-padT-padB)*(1-target/max);return `<div class="line-svg"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g stroke="#E8EDF1" stroke-width="1">${[0,1,2,3,4].map(i=>{let y=padT+(H-padT-padB)*i/4;return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`}).join('')}</g><line x1="${padL}" y1="${ty}" x2="${W-padR}" y2="${ty}" stroke="#FF7800" stroke-width="2" stroke-dasharray="7 6"/><polyline points="${actualPts}" fill="none" stroke="#0AA06C" stroke-width="3"/><polyline points="${forePts}" fill="none" stroke="#2C7AF6" stroke-width="3" stroke-dasharray="7 5"/>${actual.map((v,i)=>{let p=pt(v,i);return `<circle cx="${p[0]}" cy="${p[1]}" r="4.2" fill="#0AA06C"/>`}).join('')}${forecast.map((v,i)=>{let p=pt(v,i,forecast.length,5);return `<circle cx="${p[0]}" cy="${p[1]}" r="4.2" fill="#2C7AF6"/>`}).join('')}<g fill="#586678" font-size="12">${Array.from({length:12},(_,i)=>`<text x="${padL+(W-padL-padR)*i/11}" y="${H-10}" text-anchor="middle">${i+1}月</text>`).join('')}</g><g fill="#64717D" font-size="11">${[0,max/4,max/2,max*3/4,max].map((v,i)=>`<text x="${padL-12}" y="${padT+(H-padT-padB)*(1-i/4)+4}" text-anchor="end">${Math.round(v).toLocaleString()}</text>`).join('')}</g><g font-size="12"><line x1="390" y1="12" x2="420" y2="12" stroke="#0AA06C" stroke-width="3"/><text x="427" y="16" fill="#53616F">实际累计值</text><line x1="510" y1="12" x2="540" y2="12" stroke="#2C7AF6" stroke-width="3" stroke-dasharray=" function budgetTable(carbon){const u=carbon?'tCO₂':'tce';const rows=carbon?[['全企业','95,000','51,200','99,500','+4,500','+4.7%','超预算风险','bad'],['生产单元A','42,000','23,800','45,200','+3,200','+7.6%','关注','warn'],['生产单元B','31,000','16,600','30,300','-700','-2.3%','正常','ok'],['公辅系统','22,000','10,800','24,000','+2,000','+9.1%','关注','warn']]:[['全企业','120,600','65,000','125,600','+5,000','+4.2%','超预算风险','bad'],['生产单元A','48,000','28,000','52,500','+4,500','+9.4%','关注','warn'],['生产单元B','39,000','19,000','38,200','-800','-2.1%','正常','ok'],['公辅系统','33,600','18,000','34,900','+1,300','+3.9%','关注','warn']];return `<div class="table-card" style="border:0;box-shadow:none;padding:8px 15px 12px"><div class="section-title">预算执行分析</div><div class="table-wrap"><table><thead><tr><th>管理对象</th><th>年度目标（${u}）</th><th>当前累计（${u}）</th><th>预计全年（${u}）</th><th>偏差（${u}）</th><th>偏差（%）</th><th>状态</th></tr></thead><tbody>${rows.map(r=>`<tr onclick="openBudgetDrawer('${r[0]}')"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="${r[4].startsWith('+')?'up':'down'}">${r[4]}</td><td class="${r[5].startsWith('+')?'up':'down'}">${r[5]}</td><td><span class="status ${r[7]}">${r[6]}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function aiBudget(carbon){return `<div class="ai-card" style="border-top:1px solid var(--border)"><div class="ai-title-row"><div class="ai-title">AI分析建议</div><button class="link" onclick="toast('报告已导出')">⇩ 导出报告</button></div><div class="ai-grid three"><div class="ai-item"><div class="ai-item-head" style="color:#E53935">◉ 风险识别</div><p>${carbon?'预计全年碳排放将超过年度目标，存在碳排放预算超标风险。':'生产单元A和公辅系统是导致超预算的主要来源，需重点关注其能耗增长风险。'}</p></div><div class="ai-item"><div class="ai-item-head" style="color:#F28700">▣ 偏差原因</div><p>当前累计进度高于时间进度，主要受生产负荷提升及部分设备能效波动影响。</p></div><div class="ai-item"><div class="ai-item-head" style="color:#0A9A69">♧ 调整建议</div><p>建议聚焦高耗能单元，优化运行策略，调整后续月份预算计划，控制全年目标偏差。</p></div></div></div>`}
function assetPage(){return `<div class="page asset-page"><div class="page-head"><div><h1 class="page-title">碳资产管理</h1><div class="page-desc">实现对碳配额、CCER等碳资产的分析展示，支持履约周期资产录入、新周期配额测算及配额使用预测预警。</div></div><div class="page-actions"><button class="btn btn-primary" onclick="openAssetModal()">录入碳资产</button><button class="btn btn-ghost-green" onclick="openEstimateModal()">新周期配额测算</button></div></div>${filterHtml({period:false,month:false,periodLabel:'履约周期'})}<div class="card asset-overview"><div class="section-title">当前履约状态</div><div class="asset-kpis"><div class="asset-kpi blue"><div class="kpi-label">已分配配额</div><div class="kpi-value">95,000<span class="kpi-unit">tCO₂</span></div></div><div class="asset-kpi"><div class="kpi-label">已使用配额</div><div class="kpi-value">56,000<span class="kpi-unit">tCO₂</span></div></div><div class="asset-kpi purple"><div class="kpi-label">CCER可用量</div><div class="kpi-value">5,000<span class="kpi-unit">tCO₂</span></div></div><div class="asset-kpi orange"><div class="kpi-label">预计全年排放</div><div class="kpi-value">105,000<span class="kpi-unit">tCO₂</span></div></div><div class="asset-kpi red"><div class="kpi-label">预计缺口</div><div class="kpi-value">5,000<span class="kpi-unit">tCO₂</span></div></div></div><div class="asset-progress-row"><span class="asset-progress-label">配额与预计排放对比</span><div class="asset-progress"><span style="width:53.3%"></span><span style="width:41.9%"></span><span style="width:4.8%"></span></div><div class="asset-legend"><span><i style="background:#12A06D"></i>已使用配额　56,000 tCO₂（53.3%）</span><span><i style="background:#1C61EF"></i>剩余可用资产　44,000 tCO₂（41.9%）</span><span><i style="background:#F20C25"></i>预计缺口　5,000 tCO₂（4.8%）</span></div></div></div><div class="asset-grid"><div class="card table-card"><div class="section-title">碳资产台账</div>${assetTable()}</div><div class="card line-panel"><div class="panel-title">履约缺口趋势</div>${assetLine()}</div></div><div class="card new-cycle"><div class="section-title">新周期配额测算</div><div class="cycle-grid"><div class="cycle-item"><div class="cycle-label">基准历史排放</div><div class="cycle-value">98,500 <small>tCO₂</small></div></div><div class="cycle-item"><div class="cycle-label">初步测算配额</div><div class="cycle-value">96,000 <small>tCO₂</small></div></div><div class="cycle-item"><div class="cycle-label">较本周期变化</div><div class="cycle-value" style="color:#1769E8">+1.1%</div></div><a class="cycle-link" onclick="openEstimateModal()">查看测算说明 ＞</a></div></div>${aiAsset()}</div>`}
function assetTable(){const rows=[['碳配额','2026年度','政府分配','95,000','56,000','39,000','编辑　查看凭证'],['CCER','2026年度','市场购买','5,000','0','5,000','编辑　查看凭证'],['绿证折算减排量','2026年度','内部转化','1,200','0','1,200','待确认详情']];return `<div class="table-wrap"><table style="min-width:600px"><thead><tr><th>资产类型</th><th>履约周期</th><th>来源</th><th>数量(tCO₂)</th><th>已使用(tCO₂)</th><th>剩余量(tCO₂)</th><th>操作</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td><button class="link" onclick="openAssetDrawer('${r[0]}')">${r[6]}</button></td></tr>`).join('')}</tbody></table></div>`}
function assetLine(){const W=600,H=220,padL=48,padR=20,padT=28,padB=30,max=150,target=100;const act=[12,25,34,44,53,62],fore=[62,75,88,103,118,135];function p(v,i,start){return [padL+(W-padL-padR)*(start+i)/11,padT+(H-padT-padB)*(1-v/max)]}const a=act.map((v,i)=>p(v,i,0).join(',')).join(' '),f=fore.map((v,i)=>p(v,i,5).join(',')).join(' '),ty=padT+(H-padT-padB)*(1-target/max);return `<div class="line-svg" style="height:205px"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g stroke="#E7EBEF">${[0,1,2,3].map(i=>`<line x1="${padL}" y1="${padT+(H-padT-padB)*i/3}" x2="${W-padR}" y2="${padT+(H-padT-padB)*i/3}"/>`).join('')}</g><line x1="${padL}" y1="${ty}" x2="${W-padR}" y2="${ty}" stroke="#FF4D4F" stroke-width="2" stroke-dasharray="6 5"/><polyline points="${a}" fill="none" stroke="#0AA06C" stroke-width="3"/><polyline points="${f}" fill="none" stroke="#2878FF" stroke-width="3" stroke-dasharray="7 5"/>${act.map((v,i)=>{let q=p(v,i,0);return `<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#0AA06C"/>`}).join('')}${fore.map((v,i)=>{let q=p(v,i,5);return `<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#2878FF"/>`}).join('')}<g fill="#5A6673" font-size="11">${Array.from({length:12},(_,i)=>`<text x="${padL+(W-padL-padR)*i/11}" y="${H-8}" text-anchor="middle">${i+1}月</text>`).join('')}</g><g font-size="11" fill="#55616D"><line x1="130" y1="12" x2="155" y2="12" stroke="#0AA06C" stroke-width="3"/><text x="161" y="16">实际累计排放</text><line x1="255" y1="12" x2="280" y2="12" stroke="#2878FF" stroke-width="3" stroke-dasharray="6 4"/><text x="286" y="16">预测累计排放</text><line x1="380" y1="12" x2="405" y2="12" stroke="#F04438" stroke-width="2" stroke-dasharray="6 4"/><text x="411" y="16">年度可用资产上限</text></g></svg></div>`}
function aiAsset(){return `<div class="card ai-card"><div class="ai-title-row"><div class="ai-title">AI分析建议</div><button class="link" onclick="toast('报告已导出')">⇩ 导出报告</button></div><div class="ai-grid three"><div class="ai-item"><div class="ai-item-head" style="color:#E53935">◉ 风险识别</div><p>预计全年排放将超过当前可用资产上限，存在履约缺口风险。</p></div><div class="ai-item"><div class="ai-item-head" style="color:#F28700">◎ 原因分析</div><p>生产单元A与公辅系统排放增长较快，是缺口形成的主要来源。</p></div><div class="ai-item"><div class="ai-item-head" style="color:#0A9A69">♧ 管理建议</div><p>建议提前评估配额补充或CCER采购方案，并持续跟踪月度排放进度。</p></div></div></div>`}
function setPeriod(p){state.period=p;render()}
function setBudgetTab(t){state.budgetTab=t;document.getElementById('budgetContent').innerHTML=budgetContent();document.querySelectorAll('.budget-tab').forEach((e,i)=>e.classList.toggle('active',(i===0&&t==='energy')||(i===1&&t==='carbon')))}
function render(){document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));const titles={balance:'能效平衡与优化',analysis:'用能分析与策略推荐',budget:'用能与碳排放预算管理',asset:'碳资产管理'};document.getElementById('crumbTitle').textContent=titles[state.page];document.getElementById('tabTitle').textContent=titles[state.page];pages.innerHTML=state.page==='balance'?balancePage():state.page==='analysis'?analysisPage():state.page==='budget'?budgetPage():assetPage()}
document.querySelectorAll('.nav-item').forEach(btn=>btn.onclick=()=>{state.page=btn.dataset.page;render();window.scrollTo({top:0,behavior:'smooth'})});
function showModal(title,body,saveText='保存'){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalSave').textContent=saveText;document.getElementById('modalSave').onclick=()=>{closeModal();toast(title+'已保存')};document.getElementById('overlay').classList.add('show');document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('overlay').classList.remove('show');document.getElementById('modal').classList.remove('show')}
function showDrawer(title,body,action='生成优化方案'){document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerBody').innerHTML=body;document.getElementById('drawerAction').textContent=action;document.getElementById('drawerAction').onclick=()=>toast(action+'已执行');document.getElementById('overlay').classList.add('show');document.getElementById('drawer').classList.add('show')}
function closeDrawer(){document.getElementById('overlay').classList.remove('show');document.getElementById('drawer').classList.remove('show')}
document.getElementById('overlay').onclick=()=>{closeModal();closeDrawer()};
function toast(text){const t=document.getElementById('toast');t.textContent='✓ '+text;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}
function openBalanceDrawer(name){showDrawer(name+'｜平衡详情',`<div class="detail-section"><h4>平衡概览</h4><div class="kv-grid"><div class="kv"><span>能源输入量</span><b>8,900 tce</b></div><div class="kv"><span>终端有效利用量</span><b>6,320 tce</b></div><div class="kv"><span>回收利用量</span><b>1,230 tce</b></div><div class="kv"><span>平衡偏差</span><b style="color:#E53935">490 tce（5.5%）</b></div></div></div><div class="detail-section"><h4>能源流向</h4><div class="detail-flow">能源输入 → 终端利用 / 回收利用 / 外部输出</div></div><div class="detail-section"><h4>可能原因</h4><p style="color:#5F6B7A;line-height:1.8">计量点覆盖不足、工艺波动、设备效率下降或能源回收不足，可能导致能源去向不清晰。</p></div><div class="detail-section"><h4>建议动作</h4><p style="color:#5F6B7A;line-height:1.8">建议核查计量完整性，结合能效对标结果排查高损失环节，并跟踪后续月份偏差变化。</p></div>`)}
function openAiDrawer(title){showDrawer('AI分析｜'+title,`<div class="detail-section"><h4>分析结论</h4><p style="line-height:1.8;color:#566472">系统基于当前周期能源平衡数据、历史变化和内部对标结果生成辅助判断。该结论用于提示排查方向，最终应结合现场运行情况确认。</p></div><div class="detail-section"><h4>关联对象</h4><div class="kv-grid"><div class="kv"><span>重点对象</span><b>生产单元B</b></div><div class="kv"><span>偏差率</span><b style="color:#E53935">10.4%</b></div><div class="kv"><span>对标状态</span><b>低于内部标杆</b></div><div class="kv"><span>建议优先级</span><b>高</b></div></div></div>`)}
function openBudgetModal(){const carbon=state.budgetTab==='carbon';showModal('目标预算配置',`<div class="form-grid"><div class="form-item"><label class="required">预算年度</label><select><option>2026年</option></select></div><div class="form-item"><label class="required">管理范围</label><select><option>全企业</option><option>生产单元A</option></select></div><div class="form-item"><label class="required">预算类型</label><select><option>${carbon?'碳排放预算':'能源消费预算'}</option></select></div><div class="form-item"><label class="required">年度目标</label><input value="${carbon?'95000':'120600'}" /></div><div class="form-item"><label class="required">目标单位</label><input readonly value="${carbon?'tCO₂':'tce'}" /></div><div class="form-item"><label class="required">分解方式</label><select><option>按历史趋势分解</option><option>月度平均分解</option><option>自定义分解</option></select></div><div class="form-item full"><label>调整说明</label><textarea placeholder="填写预算制定或调整说明"></textarea></div></div>`)}
function openBudgetDrawer(name){showDrawer(name+'｜预算执行详情',`<div class="detail-section"><h4>执行概览</h4><div class="kv-grid"><div class="kv"><span>年度目标</span><b>48,000 tce</b></div><div class="kv"><span>当前累计</span><b>28,000 tce</b></div><div class="kv"><span>预计全年</span><b>52,500 tce</b></div><div class="kv"><span>预测偏差</span><b style="color:#E53935">+4,500 tce</b></div></div></div><div class="detail-section"><h4>偏差说明</h4><p style="line-height:1.8;color:#586574">当前累计消耗进度高于时间进度，预计全年存在超目标风险。建议结合后续生产计划调整月度预算。</p></div>`,'调整预算')}
function openAssetModal(){showModal('录入碳资产',`<div class="form-grid"><div class="form-item"><label class="required">资产类型</label><select><option>碳配额</option><option>CCER</option><option>其他碳资产</option></select></div><div class="form-item"><label class="required">履约周期</label><select><option>2026年度</option></select></div><div class="form-item"><label class="required">资产来源</label><select><option>政府分配</option><option>市场购买</option><option>内部转化</option></select></div><div class="form-item"><label class="required">资产数量（tCO₂）</label><input placeholder="请输入数量" /></div><div class="form-item full"><label>凭证材料</label><input type="file" /><span class="hint">支持PDF、图片等格式，单个文件不超过20MB。</span></div><div class="form-item full"><label>备注</label><textarea placeholder="填写资产来源或使用限制说明"></textarea></div></div>`)}
function openEstimateModal(){showModal('新周期配额测算',`<div class="form-grid"><div class="form-item"><label class="required">测算周期</label><select><option>2027年度</option></select></div><div class="form-item"><label class="required">测算范围</label><select><option>全企业</option></select></div><div class="form-item"><label class="required">基准历史排放</label><input value="98500" /></div><div class="form-item"><label class="required">预计产能变化</label><input value="1.1%" /></div><div class="form-item"><label class="required">测算方法</label><select><option>历史排放与业务增长综合测算</option></select></div><div class="form-item"><label>初步测算结果</label><input readonly value="96000 tCO₂" /></div><div class="form-item full"><div class="formula-note">测算结果仅用于企业内部规划，不代表主管部门最终分配结果。</div></div></div>`,'保存测算')}
function openAssetDrawer(type){showDrawer(type+'｜资产详情',`<div class="detail-section"><h4>资产信息</h4><div class="kv-grid"><div class="kv"><span>资产类型</span><b>${type}</b></div><div class="kv"><span>履约周期</span><b>2026年度</b></div><div class="kv"><span>资产来源</span><b>${type==='碳配额'?'政府分配':'市场购买'}</b></div><div class="kv"><span>剩余数量</span><b>5,000 tCO₂</b></div></div></div><div class="detail-section"><h4>凭证材料</h4><div class="kv"><span>文件名称</span><b>2026年度_${type}_凭证.pdf</b></div></div><div class="detail-section"><h4>使用记录</h4><table><thead><tr><th>日期</th><th>用途</th><th>使用量</th></tr></thead><tbody><tr><td>2026-06-30</td><td>履约预占用</td><td>0 tCO₂</td></tr></tbody></table></div>`,'编辑资产')}
render();
</script>
</body>
</html>
