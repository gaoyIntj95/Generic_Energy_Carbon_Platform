                  <td>${fmt(item.m[0],2)}</td>
                  <td>${fmt(item.m[1],2)}</td>
                  <td>…</td>
                  <td>${fmt(item.m[11],2)}</td>
                  <td>${fmt(sum(item.m),2)}</td>
                  <td>${actionButtons(index)}</td>
                </tr>
              `;
            }).join(''):tableEmpty(7)}
          </tbody>
        </table>
      </div>
      ${pagination(list.length)}
    `;
  }

  function bindCosts(){
    $('#addBtn').addEventListener('click',()=>openCostModal(null));
    $('#costYear').addEventListener('change',event=>{
      state.filters.costs.year = event.target.value;
      renderRecords();
    });
    $('#costEnergy').addEventListener('change',event=>{
      state.filters.costs.energy = event.target.value;
      renderRecords();
    });

    bindRowActions('costs',openCostModal,index=>{
      if(!confirm('确认删除该成本数据吗？')) return;
      state.costs.splice(index,1);
      renderRecords();toast('删除成功');
    });
  }

  function openCostModal(index){
    const current = index===null ? null : state.costs[index];

    openModal(index===null?'新增能源成本':'编辑能源成本',`
      <div class="form-grid">
        <div>
          <label class="required" for="costModalEnergy">能源品种</label>
          <select id="costModalEnergy">${energyOptions(current?.energy||state.energy[0]?.name)}</select>
        </div>
        <div>
          <label for="costUnit">成本单位</label>
          <input id="costUnit" value="万元" readonly>
        </div>
      </div>
      ${monthInputs(current?.m)}
      <div class="help">年度成本由系统根据1—12月数据自动汇总。</div>
    `,()=>{
      const item = {
        id:current?.id || nextId++,
        year:2026,
        energy:$('#costModalEnergy').value,
        m:readMonths()
      };

      if(index===null) state.costs.push(item);
      else state.costs[index] = item;

      closeModal();renderRecords();toast('能源成本已保存');
    });
  }

  /* =========================
     运营数据
  ========================== */

  function operationAnnual(item){
    return item.method==='年度填报' ? Number(item.annual || 0) : sum(item.m || []);
  }

  function renderOperations(){
    const f = state.filters.operations;
    const categories = ['产量与业务量','经济指标'];
    const list = state.operations.filter(item=>
      String(item.year)===String(f.year) &&
      (!f.category || item.category===f.category) &&
      (!f.keyword || item.name.includes(f.keyword) || item.unitName.includes(f.keyword))
    );
    const rows = [];
    list.forEach(item=>{
      const index = state.operations.findIndex(row=>row.id===item.id);
      const monthly = item.method==='月度填报';
      const detailOpen = state.operationDetailId===item.id;
      rows.push(`
        <tr>
          <td>${escapeHtml(item.unitName)}</td><td>${escapeHtml(item.category)}</td>
          <td>${escapeHtml(item.name)}</td><td>${escapeHtml(item.unit)}</td>
          <td>${fmt(operationAnnual(item))}</td>
          <td>
            ${monthly?`<button class="btn-link operation-detail" data-id="${item.id}" type="button">${detailOpen?'收起明细':'月度明细'}</button>`:''}
            <button class="btn-link edit-row" data-index="${index}" type="button">编辑</button>
            <button class="btn-link danger delete-row" data-index="${index}" type="button">删除</button>
          </td>
        </tr>
      `);
      if(detailOpen && monthly){
        rows.push(`
          <tr class="detail-row"><td colspan="6"><div class="detail-panel">
            <div class="detail-head">
              <span>${escapeHtml(item.unitName)}｜${escapeHtml(item.name)}月度明细</span>
              <span>单位：${escapeHtml(item.unit)}</span>
            </div>
            <div class="detail-grid">
              ${(item.m || []).map((value,index)=>`
                <div class="detail-item"><div class="detail-label">${index+1}月</div>
                <div class="detail-value">${optionalDisplay(value)}</div></div>
              `).join('')}
            </div>
            <div class="summary-line">年度合计：<strong>${fmt(operationAnnual(item))}</strong> ${escapeHtml(item.unit)}</div>
          </div></td></tr>
        `);
      }
    });

    screen.innerHTML = `
      ${toolbar(`
        <div class="field"><label for="operationYear">年度</label>
          <select id="operationYear">${selectOptions(['2026','2025'],f.year)}</select></div>
        <div class="field"><label for="operationCategory">指标类别</label>
          <select id="operationCategory">${selectOptions(categories,f.category,true)}</select></div>
        <div class="field search"><label for="operationKeyword">关键字</label>
          <input id="operationKeyword" value="${escapeHtml(f.keyword)}" placeholder="搜索指标或归属范围"></div>
      `,'新增运营数据')}
      <div class="notice">
        一期仅采集直接用于能耗强度和经营分析的<strong>产量与业务量、经济指标</strong>；规模和运行参数后续按实际功能需要扩展。
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>归属范围</th><th>指标类别</th><th>指标名称</th><th>单位</th><th>年度值</th><th>操作</th></tr></thead>
        <tbody>${rows.length?rows.join(''):tableEmpty(6)}</tbody>
      </table></div>${pagination(list.length)}
    `;

    $('#addBtn').addEventListener('click',()=>openOperationModal(null));
    $('#operationYear').addEventListener('change',event=>{state.filters.operations.year=event.target.value;renderOperations();});
    $('#operationCategory').addEventListener('change',event=>{state.filters.operations.category=event.target.value;renderOperations();});
    $('#operationKeyword').addEventListener('input',event=>{state.filters.operations.keyword=event.target.value;renderOperations();});
    document.querySelectorAll('.operation-detail').forEach(button=>{
      button.addEventListener('click',()=>{
        const id=Number(button.dataset.id);
        state.operationDetailId=state.operationDetailId===id?null:id;
        renderOperations();
      });
    });
    bindRowActions('operations',openOperationModal,index=>{
      if(!confirm('确认删除该运营数据吗？')) return;
      const id=state.operations[index].id;
      state.operations.splice(index,1);
      if(state.operationDetailId===id) state.operationDetailId=null;
      renderOperations();toast('删除成功');
    });
  }

  function openOperationModal(index){
    const current=index===null?null:state.operations[index];
    const categories=Object.keys(operationPreset);
    const initialCategory=current?.category||'产量与业务量';
    const names=Object.keys(operationPreset[initialCategory]||{});
    const currentIsPreset=!!operationPreset[initialCategory]?.[current?.name];
    const initialMetric=current?(currentIsPreset?current.name:'其他（自定义）'):names[0];

    openModal(index===null?'新增运营数据':'编辑运营数据',`
      <div class="form-grid">
        <div><label class="required" for="operationType">指标类别</label>
          <select id="operationType">${selectOptions(categories,initialCategory)}</select></div>
        <div><label class="required" for="operationMetric">指标名称</label>
          <select id="operationMetric"></select></div>
        <div id="customMetricWrap" class="${current && !currentIsPreset?'':'custom-row'}">
          <label class="required" for="customMetricName">自定义指标名称</label>
          <input id="customMetricName" value="${current && !currentIsPreset?escapeHtml(current.name):''}" placeholder="请输入指标名称"></div>
        <div><label class="required" for="operationScope">归属范围</label>
          <select id="operationScope">${groupedUnitOptions(current?.unitName||'全厂')}</select></div>
        <div id="customUnitWrap" class="${current && !currentIsPreset?'':'custom-row'}">
          <label class="required" for="operationUnitValue">单位</label>
          <input id="operationUnitValue" value="${current && !currentIsPreset?escapeHtml(current.unit):''}" placeholder="如：t、万元"></div>
        <div id="customMethodWrap" class="${current && !currentIsPreset?'':'custom-row'}">
          <label class="required" for="operationMethod">填报方式</label>
          <select id="operationMethod">${selectOptions(['月度填报','年度填报'],current?.method||'月度填报')}</select></div>
        <div class="auto-info">
          <span>计量单位：<strong id="operationAutoUnit">—</strong></span>
          <span>填报口径：<strong id="operationAutoMethod">—</strong></span>
        </div>
        <div id="annualValueWrap" class="full custom-row">
          <label class="required" for="annualValue">年度值</label>
          <input id="annualValue" type="number" min="0" step="0.01" value="${current?.annual ?? ''}" placeholder="请输入年度值"></div>
      </div>
      <div id="monthlyOperationWrap" class="custom-row">
        <div class="form-section-title">月度数据</div>${optionalMonthInputs(current?.m)}
        <div class="summary-line">当前合计：<strong id="operationLiveTotal">0</strong> <span id="operationTotalUnit"></span></div>
      </div>
    `,()=>{
      const category=$('#operationType').value;
      const selected=$('#operationMetric').value;
      const custom=selected==='其他（自定义）';
      const preset=operationPreset[category]?.[selected];
      const name=custom?$('#customMetricName').value.trim():selected;
      const unit=custom?$('#operationUnitValue').value.trim():preset.unit;
      const method=custom?$('#operationMethod').value:preset.method;
      const scope=$('#operationScope').value;
      const scopeItem=allUnits().find(item=>item.name===scope);
      if(!name) return alert('请填写指标名称。');
      if(!unit) return alert('请填写单位。');
      let months=[],annual=0;
      if(method==='月度填报'){
        months=readOptionalMonths();
        if(!months.some(value=>value!==null)) return alert('请至少填写一个月份的数据。');
      }else{
        const raw=$('#annualValue').value.trim();
        if(raw==='') return alert('请填写年度值。');
        annual=Number(raw);
      }
      const duplicate=state.operations.some((item,i)=>i!==index && String(item.year)==='2026' && item.unitName===scope && item.name===name);
      if(duplicate) return alert('该归属范围下已存在同名指标，请直接编辑原记录。');
      const item={id:current?.id||nextId++,year:2026,level:scopeItem?.level||'企业',
        unitName:scope,category,name,unit,method,
        aggregate:method==='月度填报'?'月度求和':'年度单值',annual,m:months};
      if(index===null) state.operations.push(item); else state.operations[index]=item;
      closeModal();renderOperations();toast('运营数据已保存');
    });

    const renderMetrics=(category,preferred='')=>{
      const metrics=Object.keys(operationPreset[category]||{});
      $('#operationMetric').innerHTML=metrics.map(name=>`<option ${name===preferred?'selected':''}>${escapeHtml(name)}</option>`).join('')+
        `<option ${preferred==='其他（自定义）'?'selected':''}>其他（自定义）</option>`;
      if(!preferred||![...metrics,'其他（自定义）'].includes(preferred)) $('#operationMetric').value=metrics[0]||'其他（自定义）';
      syncMetric();
    };
    const updateLiveTotal=()=>{
      const total=Array.from({length:12},(_,i)=>{const raw=$('#m'+i)?.value.trim()||'';return raw===''?0:Number(raw);}).reduce((a,b)=>a+b,0);
      $('#operationLiveTotal').textContent=fmt(total);
    };
    const syncMetric=()=>{
      const category=$('#operationType').value;
      const metric=$('#operationMetric').value;
      const custom=metric==='其他（自定义）';
      const preset=operationPreset[category]?.[metric];
      const unit=custom?($('#operationUnitValue').value||'待填写'):preset.unit;
      const method=custom?$('#operationMethod').value:preset.method;
      $('#customMetricWrap').classList.toggle('custom-row',!custom);
      $('#customUnitWrap').classList.toggle('custom-row',!custom);
      $('#customMethodWrap').classList.toggle('custom-row',!custom);
      $('#operationAutoUnit').textContent=unit;
      $('#operationAutoMethod').textContent=method==='月度填报'?'按月填报':'年度填报';
      $('#operationTotalUnit').textContent=unit;
      $('#monthlyOperationWrap').classList.toggle('custom-row',method!=='月度填报');
      $('#annualValueWrap').classList.toggle('custom-row',method!=='年度填报');
    };
    $('#operationType').addEventListener('change',event=>renderMetrics(event.target.value,''));
    $('#operationMetric').addEventListener('change',syncMetric);
    $('#operationMethod').addEventListener('change',syncMetric);
    $('#operationUnitValue').addEventListener('input',syncMetric);
    Array.from({length:12},(_,i)=>$('#m'+i)).forEach(input=>{if(input) input.addEventListener('input',updateLiveTotal);});
    renderMetrics(initialCategory,initialMetric);
    if(current && !currentIsPreset){$('#operationMethod').value=current.method;$('#operationUnitValue').value=current.unit;}
    syncMetric();updateLiveTotal();
  }

  /* =========================
     重点设备
  ========================== */

  function renderDevices(){
    const f=state.filters.devices;
    const list=state.devices.filter(item=>
      (!f.keyword||item.name.includes(f.keyword)||item.type.includes(f.keyword)) &&
      (!f.unitName||item.unitName===f.unitName) &&
      (!f.energy||item.energy===f.energy)
    );
    screen.innerHTML=`
      ${toolbar(`
        <div class="field search"><label for="deviceKeyword">关键字</label>
          <input id="deviceKeyword" value="${escapeHtml(f.keyword)}" placeholder="搜索设备名称或类型"></div>
        <div class="field"><label for="deviceUnitFilter">所属用能单元</label>
          <select id="deviceUnitFilter"><option value="">全部</option>${unitOptions(f.unitName,false)}</select></div>
        <div class="field"><label for="deviceEnergyFilter">主要能源品种</label>
          <select id="deviceEnergyFilter"><option value="">全部</option>${energyOptions(f.energy)}</select></div>
      `,'新增重点设备')}
      <div class="notice">一期仅维护设备基础档案，不在本页重复录入月度能耗；后续如需设备级计量，统一进入能源数据台账。</div>
      <div class="table-wrap"><table>
        <thead><tr><th>所属用能单元</th><th>设备名称</th><th>设备类型</th><th>主要能源品种</th><th>备注</th><th>操作</th></tr></thead>
        <tbody>${list.length?list.map(item=>{
          const index=state.devices.findIndex(row=>row.id===item.id);
          return `<tr><td>${escapeHtml(item.unitName)}</td><td>${escapeHtml(item.name)}</td>
            <td>${escapeHtml(item.type)}</td><td>${escapeHtml(item.energy)}</td>
            <td>${escapeHtml(item.remark||'—')}</td><td>${actionButtons(index)}</td></tr>`;
        }).join(''):tableEmpty(6)}</tbody>
      </table></div>${pagination(list.length)}
    `;
    $('#addBtn').addEventListener('click',()=>openDeviceModal(null));
    $('#deviceKeyword').addEventListener('input',event=>{state.filters.devices.keyword=event.target.value;renderDevices();});
    $('#deviceUnitFilter').addEventListener('change',event=>{state.filters.devices.unitName=event.target.value;renderDevices();});
    $('#deviceEnergyFilter').addEventListener('change',event=>{state.filters.devices.energy=event.target.value;renderDevices();});
    bindRowActions('devices',openDeviceModal,index=>{
      if(!confirm('确认删除该重点设备吗？')) return;
      state.devices.splice(index,1);renderDevices();toast('删除成功');
    });
  }

  function openDeviceModal(index){
    const current=index===null?null:state.devices[index];
    const isGeneric=genericDeviceTypes.slice(0,-1).includes(current?.type);
    const initialType=current?(isGeneric?current.type:'其他（自定义）'):genericDeviceTypes[0];
    openModal(index===null?'新增重点设备':'编辑重点设备',`
      <div class="form-grid">
        <div class="full"><label class="required" for="deviceUnitName">所属用能单元</label>
          <select id="deviceUnitName">${unitOptions(current?.unitName||state.units[0].children[0].name,false)}</select></div>
        <div><label class="required" for="deviceType">设备类型</label>
          <select id="deviceType">${selectOptions(genericDeviceTypes,initialType)}</select></div>
        <div id="customDeviceTypeWrap" class="${current && !isGeneric?'':'custom-row'}">
          <label class="required" for="customDeviceType">自定义设备类型</label>
          <input id="customDeviceType" value="${current && !isGeneric?escapeHtml(current.type):''}" placeholder="如：生料磨、水泥磨、回转窑"></div>
        <div><label class="required" for="deviceName">设备名称</label>
          <input id="deviceName" value="${escapeHtml(current?.name||'')}" placeholder="如：1号空压机"></div>
        <div><label class="required" for="deviceEnergy">主要能源品种</label>
          <select id="deviceEnergy">${energyOptions(current?.energy||'电力')}</select></div>
        <div class="full"><label for="deviceRemark">备注</label>
          <textarea id="deviceRemark" placeholder="选填">${escapeHtml(current?.remark||'')}</textarea></div>
      </div>
    `,()=>{
      const name=$('#deviceName').value.trim();
      const selectedType=$('#deviceType').value;
      const type=selectedType==='其他（自定义）'?$('#customDeviceType').value.trim():selectedType;
      if(!type) return alert('请填写设备类型。');
      if(!name) return alert('请填写设备名称。');
      const item={id:current?.id||nextId++,name,type,unitName:$('#deviceUnitName').value,
        energy:$('#deviceEnergy').value,remark:$('#deviceRemark').value.trim()};
      if(index===null) state.devices.push(item); else state.devices[index]=item;
      closeModal();renderDevices();toast('重点设备已保存');
    });
    const hints={'动力设备':'如：1号电机','泵类设备':'如：循环水泵1','风机设备':'如：窑尾高温风机',
      '空压设备':'如：1号空压机','制冷/空调设备':'如：中央空调主机1',
      '加热/锅炉设备':'如：燃气锅炉1','输送设备':'如：皮带输送机1',
      '其他（自定义）':'请输入具体设备名称'};
    const sync=()=>{
      const type=$('#deviceType').value;
      $('#customDeviceTypeWrap').classList.toggle('custom-row',type!=='其他（自定义）');
      $('#deviceName').placeholder=hints[type]||'请输入设备名称';
    };
    $('#deviceType').addEventListener('change',sync);sync();
  }

  /* =========================
     通用组件与事件
  ========================== */

  function monthInputs(values=[]){
    return `
      <div class="month-grid">
        ${Array.from({length:12},(_,index)=>`
          <div>
            <label class="required" for="m${index}">${index+1}月</label>
            <input id="m${index}" type="number" min="0" step="0.01" value="${values[index]??0}">
          </div>
        `).join('')}
      </div>
    `;
  }

  function readMonths(){
    return Array.from({length:12},(_,index)=>Number($('#m'+index).value||0));
  }

  function bindRowActions(key,editHandler,deleteHandler){
    document.querySelectorAll('.edit-row').forEach(button=>{
      button.addEventListener('click',()=>editHandler(Number(button.dataset.index)));
    });
    document.querySelectorAll('.delete-row').forEach(button=>{
      button.addEventListener('click',()=>deleteHandler(Number(button.dataset.index)));
    });
  }

  function openModal(title,body,onSave,small=false){
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = body;
    $('#modal').classList.toggle('small',small);
    state.saveHandler = onSave;
    overlay.classList.add('open');
  }

  function closeModal(){
    overlay.classList.remove('open');
    state.saveHandler = null;
  }

  $('#modalClose').addEventListener('click',closeModal);
  $('#modalCancel').addEventListener('click',closeModal);
  $('#modalSave').addEventListener('click',()=>{
    if(state.saveHandler) state.saveHandler();
  });
  overlay.addEventListener('click',event=>{
    if(event.target===overlay) closeModal();
  });

  document.querySelectorAll('.menu-item[data-page]').forEach(button=>{
    button.addEventListener('click',()=>{
      state.page = button.dataset.page;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
