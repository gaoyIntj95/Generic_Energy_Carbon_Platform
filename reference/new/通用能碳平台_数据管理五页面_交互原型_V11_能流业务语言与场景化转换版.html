<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通用能碳平台｜能源数据管理 V11</title>
  <style>
    :root{
      --gcl-green:#00A870;
      --gcl-green-dark:#00875A;
      --gcl-green-light:#EAF8F3;
      --gcl-green-soft:#F3FAF7;
      --tech-blue:#1677FF;
      --nav-bg:#142133;
      --nav-hover:#203149;
      --page-bg:#F4F6F8;
      --card-bg:#FFFFFF;
      --text:#172033;
      --text-secondary:#5F6B7A;
      --text-muted:#8A94A3;
      --border:#E4E9EF;
      --table-head:#F7F9FB;
      --tree-parent:#FAFCFB;
      --danger:#F04438;
      --warning:#F79009;
      --shadow:0 8px 28px rgba(16,24,40,.14);
      --radius:8px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;min-height:100%;
      font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
      color:var(--text);background:var(--page-bg)
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{display:flex;min-height:100vh}
    .sidebar{
      width:224px;background:var(--nav-bg);color:#fff;
      display:flex;flex-direction:column;
      position:fixed;left:0;top:0;bottom:0;z-index:20;
    }
    .brand{
      height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;
      border-bottom:1px solid rgba(255,255,255,.08);
      font-size:16px;font-weight:600;
    }
    .brand-logo{
      width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
      background:linear-gradient(135deg,#00B578 0%,#1677FF 100%);
      font-size:12px;font-weight:700;
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);
    }
    .menu-section{padding:16px 12px 6px;font-size:12px;color:#8190A5}
    .menu-item{
      height:44px;margin:3px 8px;padding:0 14px;border:0;border-radius:6px;
      background:transparent;color:#B7C2D1;display:flex;align-items:center;gap:10px;
      width:calc(100% - 16px);text-align:left;transition:.15s;
    }
    .menu-item:hover{background:var(--nav-hover);color:#fff}
    .menu-item.active{background:rgba(0,168,112,.16);color:#fff;position:relative}
    .menu-item.active::before{
      content:"";position:absolute;left:-8px;width:3px;height:24px;border-radius:2px;background:var(--gcl-green)
    }
    .menu-icon{width:18px;text-align:center;font-size:15px}
    .sidebar-footer{
      margin-top:auto;border-top:1px solid rgba(255,255,255,.08);
      padding:10px 12px 16px
    }
    .main{margin-left:224px;width:calc(100% - 224px);min-width:0}
    .topbar{
      height:64px;background:#fff;border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;padding:0 24px;
      position:sticky;top:0;z-index:10;
    }
    .breadcrumb{font-size:14px;color:var(--text-muted)}
    .breadcrumb strong{color:var(--text-secondary);font-weight:500}
    .user{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-secondary)}
    .avatar{
      width:30px;height:30px;border-radius:50%;background:#E8ECF1;
      display:grid;place-items:center;color:#7A8594
    }
    .content{padding:24px}
    .page-head{margin-bottom:18px}
    .page-title{margin:0;font-size:22px;font-weight:600}
    .page-desc{margin-top:7px;font-size:14px;color:var(--text-muted)}
    .card{
      background:var(--card-bg);border:1px solid var(--border);
      border-radius:var(--radius);box-shadow:0 1px 2px rgba(28,45,72,.03)
    }
    .toolbar{
      min-height:74px;padding:16px;display:flex;align-items:flex-end;
      gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)
    }
    .field{min-width:155px}
    .field.search{min-width:240px}
    label{display:block;margin-bottom:6px;font-size:13px;color:var(--text-secondary)}
    input,select,textarea{
      width:100%;height:38px;border:1px solid #D8DEE7;border-radius:6px;
      background:#fff;padding:0 11px;color:var(--text);outline:none;transition:.15s
    }
    textarea{height:86px;padding-top:9px;resize:vertical}
    input:focus,select:focus,textarea:focus{
      border-color:var(--gcl-green);
      box-shadow:0 0 0 2px rgba(0,168,112,.10)
    }
    input[readonly]{
      background:#F7F9FB;color:var(--text-secondary);cursor:not-allowed
    }
    .spacer{flex:1}
    .btn{
      height:38px;border-radius:6px;padding:0 15px;border:1px solid var(--border);
      background:#fff;display:inline-flex;align-items:center;justify-content:center;
      gap:6px;color:var(--text-secondary);transition:.15s;white-space:nowrap
    }
    .btn:hover{border-color:var(--gcl-green);color:var(--gcl-green)}
    .btn-primary{background:var(--gcl-green);border-color:var(--gcl-green);color:#fff}
    .btn-primary:hover{
      background:var(--gcl-green-dark);border-color:var(--gcl-green-dark);color:#fff
    }
    .btn-link{
      height:auto;padding:2px 4px;border:0;background:transparent;color:var(--tech-blue)
    }
    .btn-link.danger{color:var(--danger)}
    .notice{
      margin:14px 16px;padding:10px 12px;background:var(--gcl-green-soft);
      border:1px solid #D5EFE5;border-radius:6px;color:#467565;font-size:13px
    }
    .notice strong{font-weight:600;color:var(--gcl-green-dark)}
    .context-strip{
      grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
      padding:11px 13px;border:1px solid #D5EFE5;border-radius:6px;
      background:var(--gcl-green-soft);color:var(--text-secondary);font-size:13px
    }
    .context-strip strong{color:var(--gcl-green-dark);font-weight:600}
    .context-divider{width:1px;height:16px;background:#D6E7E0}
    .tabs{
      height:50px;padding:0 16px;display:flex;gap:28px;
      border-bottom:1px solid var(--border)
    }
    .tab{
      border:0;background:transparent;color:var(--text-secondary);
      position:relative;padding:0 2px;font-size:14px
    }
    .tab.active{color:var(--gcl-green);font-weight:600}
    .tab.active::after{
      content:"";height:2px;background:var(--gcl-green);
      position:absolute;left:0;right:0;bottom:0
    }
    .level-tabs{
      display:flex;gap:6px;padding:12px 16px 0;background:#fff;
      border-bottom:1px solid var(--border);overflow-x:auto
    }
    .level-tab{
      height:36px;padding:0 14px;border:1px solid transparent;border-radius:6px 6px 0 0;
      background:transparent;color:var(--text-secondary);white-space:nowrap
    }
    .level-tab:hover{color:var(--gcl-green)}
    .level-tab.active{
      color:var(--gcl-green-dark);font-weight:600;background:var(--gcl-green-soft);
      border-color:#D5EFE5;border-bottom-color:var(--gcl-green-soft)
    }
    .table-wrap{width:100%;overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:920px}
    th,td{
      height:52px;padding:0 14px;border-bottom:1px solid #EDF0F4;
      text-align:left;font-size:14px;white-space:nowrap
    }
    th{
      height:44px;background:var(--table-head);
      font-size:13px;color:var(--text-secondary);font-weight:500
    }
    tbody tr:hover td{background:#FBFDFC}
    tbody tr.parent-row td{background:var(--tree-parent)}
    tbody tr.parent-row:hover td{background:#F5FAF8}
    .unit-cell{display:flex;align-items:center;gap:8px}
    .tree-toggle{
      width:22px;height:22px;border:1px solid #DDE5E1;border-radius:4px;
      display:grid;place-items:center;background:#fff;color:var(--gcl-green-dark);
      padding:0;font-size:12px;flex:none
    }
    .parent-name{font-weight:600}
    .child-name{padding-left:30px;position:relative}
    .child-name::before{
      content:"";position:absolute;left:9px;top:50%;width:13px;height:16px;
      border-left:1px solid #C9D4CF;border-bottom:1px solid #C9D4CF;
      transform:translateY(-10px)
    }
    .child-count{
      display:inline-flex;height:22px;padding:0 7px;align-items:center;
      border-radius:11px;background:var(--gcl-green-light);
      color:var(--gcl-green-dark);font-size:12px;font-weight:400
    }
    .tag{
      display:inline-flex;align-items:center;height:24px;padding:0 8px;
      border-radius:4px;font-size:12px;background:var(--gcl-green-light);
      color:var(--gcl-green-dark);border:1px solid #BFE9D9
    }
    .tag.blue{background:#EEF5FF;color:#1769C2;border-color:#CFE3FF}
    .tag.gray{background:#F1F3F5;color:#667085;border-color:#E3E7EC}
    .tag.orange{background:#FFF7E8;color:#B54708;border-color:#FDE1B4}
    .pagination{
      height:56px;padding:0 16px;display:flex;justify-content:flex-end;
      align-items:center;gap:10px;color:var(--text-muted);font-size:13px
    }
    .page-dot{
      width:30px;height:30px;border:1px solid var(--gcl-green);
      color:var(--gcl-green);border-radius:5px;display:grid;place-items:center
    }
    .empty{
      height:130px;text-align:center;color:var(--text-muted)
    }
    .overlay{
      position:fixed;inset:0;background:rgba(16,24,40,.48);z-index:100;
      display:none;align-items:center;justify-content:center;padding:20px
    }
    .overlay.open{display:flex}
    .modal{
      width:min(760px,96vw);max-height:90vh;overflow:auto;
      background:#fff;border-radius:10px;box-shadow:var(--shadow)
    }
    .modal.small{width:min(620px,96vw)}
    .modal-head{
      height:60px;padding:0 22px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between
    }
    .modal-title{font-size:17px;font-weight:600}
    .modal-close{border:0;background:transparent;font-size:23px;color:#8993A2}
    .modal-body{padding:22px}
    .form-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 18px
    }
    .full{grid-column:1/-1}
    .required::before{content:"*";color:var(--danger);margin-right:4px}
    .help{font-size:12px;color:var(--text-muted);margin-top:5px}
    .month-grid{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
      gap:15px 14px;margin-top:20px
    }
    .modal-foot{
      height:64px;padding:0 22px;border-top:1px solid var(--border);
      display:flex;justify-content:flex-end;align-items:center;gap:10px
    }
    .custom-row{display:none}
    .custom-row.show{display:block}
    .choice-row{
      display:flex;gap:10px;flex-wrap:wrap;margin-top:2px
    }
    .choice{
      border:1px solid #D8DEE7;background:#fff;border-radius:6px;
      padding:8px 12px;color:var(--text-secondary)
    }
    .choice.active{
      border-color:var(--gcl-green);background:var(--gcl-green-soft);
      color:var(--gcl-green-dark)
    }
    .form-section-title{
      margin-top:18px;padding-bottom:9px;border-bottom:1px solid var(--border);
      font-size:14px;font-weight:600
    }
    .auto-info{
      grid-column:1/-1;display:flex;gap:22px;align-items:center;flex-wrap:wrap;
      padding:10px 12px;background:#F7F9FB;border:1px solid var(--border);
      border-radius:6px;color:var(--text-secondary);font-size:13px
    }
    .auto-info strong{color:var(--text);font-weight:600}
    .detail-row td{background:#FAFCFB!important;padding:14px 18px}
    .detail-panel{
      border:1px solid #DCE9E3;border-radius:7px;background:#fff;padding:14px
    }
    .detail-head{
      display:flex;justify-content:space-between;gap:12px;align-items:center;
      margin-bottom:12px;color:var(--text-secondary);font-size:13px
    }
    .detail-grid{
      display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px
    }
    .detail-item{
      padding:9px 10px;border:1px solid #EDF0F4;border-radius:6px;background:#FBFCFD
    }
    .detail-label{font-size:12px;color:var(--text-muted)}
    .detail-value{margin-top:3px;font-size:14px;color:var(--text)}
    .summary-line{
      display:flex;justify-content:flex-end;gap:8px;align-items:center;
      margin-top:12px;color:var(--text-secondary);font-size:13px
    }
    .summary-line strong{color:var(--gcl-green-dark);font-size:16px}
    @media(max-width:900px){
      .detail-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    .toast{
      position:fixed;right:24px;top:82px;z-index:200;background:#fff;
      border:1px solid #CDEBDD;box-shadow:var(--shadow);border-radius:8px;
      padding:12px 16px;display:none;align-items:center;gap:8px;
      color:var(--gcl-green-dark);font-size:14px
    }
    .toast.show{display:flex}
    @media(max-width:900px){
      .sidebar{width:72px}
      .brand span,.menu-section,.menu-item span:last-child,.sidebar-footer{display:none}
      .brand{justify-content:center;padding:0}
      .menu-item{justify-content:center;padding:0;margin-left:8px}
      .main{margin-left:72px;width:calc(100% - 72px)}
      .form-grid,.month-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .full{grid-column:1/-1}
    }

    /* ===== V10 能源转换关系协同重构 ===== */
    .relation-section{padding:16px;border-top:1px solid var(--border)}
    .relation-section:first-child{border-top:0}
    .relation-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
    .relation-section-title{font-size:14px;font-weight:600;color:var(--text)}
    .relation-section-desc{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.6}
    .relation-editor{display:grid;gap:10px}
    .relation-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
    .relation-row .btn{width:38px;padding:0}
    .relation-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
    .relation-summary-item{padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:#F8FAFB}
    .relation-summary-label{font-size:12px;color:var(--text-muted)}
    .relation-summary-value{margin-top:4px;font-size:14px;font-weight:600;color:var(--text)}
    .relation-preview{padding:12px 14px;border:1px solid #D5EFE5;border-radius:7px;background:var(--gcl-green-soft);line-height:1.7;color:var(--text-secondary)}
    .relation-preview strong{color:var(--gcl-green-dark)}
    .readonly-section{border-top:1px solid var(--border);padding-top:0}
    .section-toolbar{min-height:58px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border)}
    .section-toolbar-title{font-size:15px;font-weight:600}
    .section-toolbar-desc{font-size:12px;color:var(--text-muted);margin-top:4px}
    .tag.purple{background:#F3EEFF;color:#6941C6;border-color:#DDD2FF}
    @media(max-width:900px){.relation-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

    /* ===== V11 一期轻量化：能源量角色与场景化转换 ===== */
    .role-tabs{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;border-bottom:1px solid var(--border)}
    .role-tab{height:36px;padding:0 14px;border:1px solid #D8DEE7;border-bottom:0;border-radius:7px 7px 0 0;background:#fff;color:var(--text-secondary);white-space:nowrap}
    .role-tab.active{background:var(--gcl-green-soft);border-color:#BFE9D9;color:var(--gcl-green-dark);font-weight:600}
    .stage-map{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .stage-pill{display:inline-flex;align-items:center;height:25px;padding:0 9px;border-radius:13px;background:#EEF5FF;color:#1769C2;font-size:12px}
    .stage-arrow{color:var(--text-muted)}
    .conversion-mark{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid #F3D7A7;border-radius:4px;background:#FFF8E8;color:#B54708;font-size:12px}
    .scene-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .scene-card{min-height:72px;padding:12px;border:1px solid #D8DEE7;border-radius:8px;background:#fff;text-align:left;color:var(--text-secondary)}
    .scene-card strong{display:block;color:var(--text);font-size:14px;margin-bottom:5px}
    .scene-card span{font-size:12px;line-height:1.5}
    .scene-card.active{border-color:var(--gcl-green);background:var(--gcl-green-soft);box-shadow:0 0 0 2px rgba(0,168,112,.08)}
    .scene-card.active strong{color:var(--gcl-green-dark)}
    .simple-relation-grid{display:grid;grid-template-columns:1fr 50px 1fr;gap:12px;align-items:end}
    .relation-arrow{height:38px;display:grid;place-items:center;color:var(--gcl-green-dark);font-size:22px}
    .advanced-link{border:0;background:transparent;color:var(--tech-blue);padding:4px 0;font-size:13px}
    .advanced-box{display:none;padding:12px;border:1px dashed #CDD6E0;border-radius:7px;background:#FAFCFD}
    .advanced-box.show{display:block}
    @media(max-width:900px){
      .scene-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .simple-relation-grid{grid-template-columns:1fr}
      .relation-arrow{height:18px;transform:rotate(90deg)}
    }

  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">AI</div>
      <span>协鑫能碳管理平台</span>
    </div>

    <div class="menu-section">数据管理</div>
    <button class="menu-item active" data-page="units">
      <span class="menu-icon">▦</span><span>用能单元</span>
    </button>
    <button class="menu-item" data-page="energy">
      <span class="menu-icon">◈</span><span>能源品种</span>
    </button>
    <button class="menu-item" data-page="records">
      <span class="menu-icon">▤</span><span>能源数据</span>
    </button>
    <button class="menu-item" data-page="operations">
      <span class="menu-icon">◫</span><span>运营数据</span>
    </button>
    <button class="menu-item" data-page="devices">
      <span class="menu-icon">⚙</span><span>重点设备</span>
    </button>

    <div class="sidebar-footer">
      <button class="menu-item">
        <span class="menu-icon">⚙</span><span>系统设置</span>
      </button>
      <button class="menu-item">
        <span class="menu-icon">?</span><span>帮助文档</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="breadcrumb">
        首页&nbsp;&nbsp;/&nbsp;&nbsp;数据管理&nbsp;&nbsp;/&nbsp;&nbsp;<strong id="crumb">用能单元</strong>
      </div>
      <div class="user"><div class="avatar">人</div><span>管理员</span></div>
    </header>

    <section class="content">
      <div class="page-head">
        <h1 class="page-title" id="pageTitle">用能单元管理</h1>
        <div class="page-desc" id="pageDesc">配置企业用能单元及上下级关系，用于能源数据归属、查询与分析。</div>
      </div>
      <div class="card" id="screen"></div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">新增</div>
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" id="modalCancel" type="button">取消</button>
      <button class="btn btn-primary" id="modalSave" type="button">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" aria-live="polite">
  <span>✓</span><span id="toastText">保存成功</span>
</div>

<script>
(() => {
  let nextId = 100;

  const analysisCategories = [
    '电力','热力','化石燃料','可再生及替代能源','回收能源','其他能源'
  ];

  const unitTypes = ['生产单元','工序/环节','公辅系统','建筑/区域','其他'];

  const operationPreset = {
    '产量与业务量':{
      '产品产量':{unit:'t',method:'月度填报'},
      '熟料产量':{unit:'t',method:'月度填报'},
      '水泥产量':{unit:'t',method:'月度填报'},
      '服务量':{unit:'项',method:'月度填报'},
      '运输量':{unit:'t',method:'月度填报'}
    },
    '经济指标':{
      '工业总产值':{unit:'万元',method:'年度填报'},
      '工业增加值':{unit:'万元',method:'年度填报'},
      '营业收入':{unit:'万元',method:'年度填报'}
    }
  };

  const genericDeviceTypes = [
    '动力设备','泵类设备','风机设备','空压设备',
    '制冷/空调设备','加热/锅炉设备','输送设备','其他（自定义）'
  ];

  function escapeHtml(text){
    return String(text ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");
  }

  function fmt(value, digits=0){
    return Number(value || 0).toLocaleString('zh-CN',{
      minimumFractionDigits:digits,
      maximumFractionDigits:digits
    });
  }

  function sum(values){
    return (values || []).reduce((total,value)=>total+Number(value || 0),0);

  function allUnits(){
    const list = [{name:'全厂',level:'企业'}];
    state.units.forEach(parent=>{
      list.push({name:parent.name,level:'一级用能单元'});
      parent.children.forEach(child=>{
        list.push({name:child.name,level:'二级用能单元'});
      });
    });
    return list;
  }

  function findUnitByName(name){
    for(const parent of state.units){
      if(parent.name===name) return parent;
      const child=parent.children.find(item=>item.name===name);
      if(child) return child;
    }
    return null;
  }

  function conversionUnits(scene=''){
    const list=[];
    state.units.forEach(parent=>{
      if(parent.conversionCategory) list.push(parent);
      parent.children.forEach(child=>{if(child.conversionCategory) list.push(child);});
    });
    if(!scene || scene==='其他转换') return list;
    return list.filter(item=>item.conversionCategory===scene);
  }

  function conversionUnitOptions(scene='',selected=''){
    const list=conversionUnits(scene);
    const head=list.length?'':'<option value="">暂无匹配单元，请先在“用能单元”中设置能源转换场景</option>';
    return head+list.map(item=>`<option value="${escapeHtml(item.name)}" ${item.name===selected?'selected':''}>${escapeHtml(item.name)}</option>`).join('');
  }

  function renderUnits(){
    const filter = state.filters.units;
    const rows = [];

    state.units.forEach(parent=>{
      const parentMatches =
        (!filter.keyword || parent.name.includes(filter.keyword)) &&
        (!filter.type || parent.type===filter.type);

      const matchedChildren = parent.children.filter(child=>
        (!filter.keyword || child.name.includes(filter.keyword)) &&
        (!filter.type || child.type===filter.type)
      );

      if(!parentMatches && matchedChildren.length===0) return;

      const expanded = state.expanded.has(parent.id) || filter.keyword || filter.type;
      const parentConversion = parent.conversionCategory
        ? `<span class="conversion-mark">${escapeHtml(parent.conversionCategory)}</span>` : '—';

      rows.push(`
        <tr class="parent-row">
          <td>
            <div class="unit-cell">
              <button class="tree-toggle" type="button" data-toggle="${parent.id}">
                ${expanded?'−':'+'}
              </button>
              <span class="parent-name">${escapeHtml(parent.name)}</span>
              <span class="child-count">${parent.children.length}个下级</span>
            </div>
          </td>
          <td><span class="tag">一级</span></td>
          <td>${escapeHtml(parent.type)}</td>
          <td>${parentConversion}</td>
          <td>

    return `

          <label class="required" for="unitType">单元类型</label>
          <select id="unitType">${selectOptions(options,data.type||options[0])}</select>

  function bindUnitNameHint(level){
    const type = $('#unitType');
    const name = $('#unitName');
    if(!type || !name) return;

    const placeholders = {
      '生产单元':'如：1号熟料生产线、生产车间一',
      '工序/环节':'如：熟料烧成、包装发运',
      '公辅系统':'如：空压系统、供配电系统',
      '建筑/区域':'如：办公楼、仓储区域',
      '其他':'请输入具体用能单元名称'
    };

    const update = ()=>{
      name.placeholder = placeholders[type.value] || '请输入用能单元名称';
    };
    type.addEventListener('change',update);
    update();
  }

  function openAddRootUnit(){
    openModal('新增一级用能单元',unitForm({},1,null,false),()=>{
      const name = $('#unitName').value.trim();
      if(!name) return alert('请填写用能单元名称。');
      if(unitNameExists(name)) return alert('用能单元名称已存在。');

      state.units.push({
        id:nextId++,name,level:1,type:$('#unitType').value,
        conversionCategory:$('#unitConversionCategory').value,
        remark:$('#unitRemark').value.trim(),
        referenced:false,children:[]
      });
      closeModal();renderUnits();toast('保存成功');
    },true);
    bindUnitNameHint(1);
  }

  function openAddChildUnit(parentId){
    const parent = state.units.find(item=>item.id===parentId);
    if(!parent) return;

    openModal('添加下级用能单元',unitForm({},2,parent,false),()=>{
      const name = $('#unitName').value.trim();
      if(!name) return alert('请填写用能单元名称。');
      if(unitNameExists(name)) return alert('用能单元名称已存在。');

      parent.children.push({
        id:nextId++,name,level:2,type:$('#unitType').value,
        conversionCategory:$('#unitConversionCategory').value,
        remark:$('#unitRemark').value.trim(),
        referenced:false
      });
      state.expanded.add(parent.id);
      closeModal();renderUnits();toast('保存成功');
    },true);
    bindUnitNameHint(2);
  }

  function openEditUnit(id,level,parentId){
    if(level===1){
      const item = state.units.find(unit=>unit.id===id);
      if(!item) return;

      openModal('编辑一级用能单元',unitForm(item,1,null,true),()=>{
        const name = $('#unitName').value.trim();
        if(!name) return alert('请填写用能单元名称。');
        if(unitNameExists(name,id)) return alert('用能单元名称已存在。');

        Object.assign(item,{
          name,type:$('#unitType').value,
          conversionCategory:$('#unitConversionCategory').value,
          remark:$('#unitRemark').value.trim()
        });
        closeModal();renderUnits();toast('保存成功');
      },true);
      bindUnitNameHint(1);
    }else{
      const parent = state.units.find(unit=>unit.id===parentId);
      const item = parent?.children.find(child=>child.id===id);
      if(!parent || !item) return;

      openModal('编辑下级用能单元',unitForm(item,2,parent,true),()=>{
        const name = $('#unitName').value.trim();
        if(!name) return alert('请填写用能单元名称。');
        if(unitNameExists(name,id)) return alert('用能单元名称已存在。');

        Object.assign(item,{
          name,type:$('#unitType').value,
          conversionCategory:$('#unitConversionCategory').value,
          remark:$('#unitRemark').value.trim()
        });
        closeModal();renderUnits();toast('保存成功');
      },true);
      bindUnitNameHint(2);
    }
  }

  function unitNameExists(name,excludeId=null){
    return state.units.some(parent=>{
      if(parent.id!==excludeId && parent.name===name) return true;
      return parent.children.some(child=>child.id!==excludeId && child.name===name);
    });
  }

  function deleteUnit(id,level,parentId){
    let item;
    if(level===1) item = state.units.find(unit=>unit.id===id);
    else item = state.units.find(unit=>unit.id===parentId)?.children.find(child=>child.id===id);
    if(!item) return;

    if(level===1 && item.children.length){
      return alert('该一级用能单元仍包含下级单元，请先删除下级单元。');
    }
    if(item.referenced){
      return alert('该用能单元已关联能源、运营或设备数据，暂不能删除。');
    }
    if(!confirm(`确认删除“${item.name}”吗？`)) return;

    if(level===1){
      state.units = state.units.filter(unit=>unit.id!==id);
    }else{
      const parent = state.units.find(unit=>unit.id===parentId);
      parent.children = parent.children.filter(child=>child.id!==id);
    }
    renderUnits();toast('删除成功');
  }

  function openEnergyModal(index){
    const current = index===null ? null : state.energy[index];
    const currentIsPreset = !!(current && energyPreset[current.name]);
    const initialCategory = current?.category || '电力';

    const presetNamesFor = category =>
      Object.keys(energyPreset).filter(name=>energyPreset[name].category===category);

    const initialPresetNames = presetNamesFor(initialCategory);
    const initialEnergyValue = currentIsPreset
      ? current.name
      : (current ? '其他（自定义）' : (initialPresetNames[0] || '其他（自定义）'));

    const body = `
      <div class="form-grid">
        <div>
          <label class="required" for="energyCategory">分析类别</label>
          <select id="energyCategory">
            ${selectOptions(analysisCategories,initialCategory)}
          </select>
        </div>

        <div>
          <label class="required" for="energyNameSelect">能源品种</label>
          <select id="energyNameSelect"></select>
          <div class="help">仅显示当前分析类别下的预置能源品种。</div>
        </div>

        <div id="customEnergyRow" class="${current && !currentIsPreset?'':'custom-row'}">
          <label class="required" for="customEnergyName">自定义能源名称</label>
          <input id="customEnergyName" value="${current && !currentIsPreset?escapeHtml(current.name):''}" placeholder="如：企业特殊能源介质">
        </div>

        <div>
          <label class="required" for="energyUnit">计量单位</label>
          <select id="energyUnit">
            ${selectOptions(['kWh','t','kg','Nm³','m³','GJ','MJ','其他'],current?.unit||'kWh')}
          </select>
        </div>

        <div>
          <label class="required" for="energyFactor">折标系数</label>
          <input id="energyFactor" type="number" step="0.0001" min="0" value="${current?.factor??0.1229}">
        </div>

        <div>
          <label for="factorUnit">折标单位</label>
          <input id="factorUnit" value="${escapeHtml(current?.factorUnit||'kgce/kWh')}" readonly>
        </div>

        <div class="full">
          <label for="energyRemark">备注</label>
          <textarea id="energyRemark" placeholder="选填，可说明企业采用的特殊参数口径">${escapeHtml(current?.remark||'')}</textarea>
        </div>
      </div>
    `;

    openModal(index===null?'新增能源品种':'编辑能源品种',body,()=>{
      const selected = $('#energyNameSelect').value;
      const custom = selected==='其他（自定义）';
      const name = custom ? $('#customEnergyName').value.trim() : selected;

      if(!name) return alert('请填写能源品种名称。');

      const duplicate = state.energy.some((item,i)=>i!==index && item.name===name);
      if(duplicate) return alert('该能源品种已存在。');

      const item = {
        id:current?.id || nextId++,
        category:$('#energyCategory').value,
        name,
        unit:$('#energyUnit').value,
        factor:Number($('#energyFactor').value||0),
        factorUnit:$('#factorUnit').value,
        remark:$('#energyRemark').value.trim(),
        referenced:current?.referenced || false
      };

      if(index===null) state.energy.push(item);
      else state.energy[index] = item;

      closeModal();renderEnergy();toast('保存成功');
    });

    const updateFactorUnit = ()=>{
      const unit = $('#energyUnit').value;
      const prefix = unit==='t' || unit==='GJ' ? 'tce' : 'kgce';
      $('#factorUnit').value = `${prefix}/${unit}`;
    };

    const applyPreset = name=>{
      const preset = energyPreset[name];
      if(!preset) return;
      $('#energyUnit').value = preset.unit;
      $('#energyFactor').value = preset.factor;
      $('#energyUnit').disabled = true;
      updateFactorUnit();
    };

    const renderEnergyNames = (category,preferred='')=>{
      const names = presetNamesFor(category);
      $('#energyNameSelect').innerHTML =
        names.map(name=>`<option ${name===preferred?'selected':''}>${escapeHtml(name)}</option>`).join('') +
        `<option ${preferred==='其他（自定义）'?'selected':''}>其他（自定义）</option>`;

      if(!preferred || (![...names,'其他（自定义）'].includes(preferred))){
        $('#energyNameSelect').value = names[0] || '其他（自定义）';
      }
      syncEnergyMode();
    };

    const syncEnergyMode = ()=>{
      const selected = $('#energyNameSelect').value;
      const custom = selected==='其他（自定义）';
      $('#customEnergyRow').classList.toggle('custom-row',!custom);
      $('#energyUnit').disabled = !custom;
      if(custom){
        updateFactorUnit();
      }else{
        applyPreset(selected);
      }
    };

    $('#energyCategory').addEventListener('change',event=>{
      renderEnergyNames(event.target.value,'');
    });
    $('#energyNameSelect').addEventListener('change',syncEnergyMode);
    $('#energyUnit').addEventListener('change',updateFactorUnit);

    renderEnergyNames(initialCategory,initialEnergyValue);
  }

    const item = state.energy[index];

    if(!confirm(`确认删除“${item.name}”吗？`)) return;

      (!f.category || item.category===f.category) &&
      (!f.keyword || item.energy.includes(f.keyword) || item.unitName.includes(f.keyword))

    const levelKey=item=>item.level==='企业'?'enterprise':item.level==='一级用能单元'?'level1':'level2';
    const counts={
      all:baseList.length,
      enterprise:baseList.filter(item=>levelKey(item)==='enterprise').length,
      level1:baseList.filter(item=>levelKey(item)==='level1').length,
      level2:baseList.filter(item=>levelKey(item)==='level2').length

  function bindConsumption(){
    $('#addBtn').addEventListener('click',()=>openConsumptionModal(null,state.consumptionLevel,state.energyDataRole));

    document.querySelectorAll('[data-role-tab]').forEach(button=>{
      button.addEventListener('click',()=>{
        state.energyDataRole=button.dataset.roleTab;
        state.recordDetailId=null;
        renderRecords();
      });
    });

    document.querySelectorAll('[data-level-tab]').forEach(button=>{
      button.addEventListener('click',()=>{
        state.consumptionLevel=button.dataset.levelTab;
        state.recordDetailId=null;
        renderRecords();
      });
    });

    const mappings = {
      recordYear:'year',
      recordCategory:'category'
    };

    Object.entries(mappings).forEach(([id,key])=>{
      $('#'+id).addEventListener('change',event=>{
        state.filters.consumption[key] = event.target.value;
        renderRecords();
      });
    });

    $('#recordKeyword').addEventListener('input',event=>{
      state.filters.consumption.keyword = event.target.value;
      renderRecords();
    });

    document.querySelectorAll('.detail-record').forEach(button=>{
      button.addEventListener('click',()=>{
        const id = Number(button.dataset.id);
        state.recordDetailId = state.recordDetailId===id ? null : id;
        renderRecords();
      });
    });

    bindRowActions('consumption',index=>openConsumptionModal(index,'all',state.consumption[index]?.dataType||state.energyDataRole),index=>{
      const item=state.consumption[index];
      const referenced=state.flows.some(flow=>(flow.inputRecordIds||[]).includes(item.id)||(flow.outputRecordIds||[]).includes(item.id));
      if(referenced) return alert('该能源数据已被能源转换关系引用，请先调整对应关系。');
      if(!confirm(`确认删除该${item.dataType}数据吗？`)) return;
      const deletedId = item.id;
      state.consumption.splice(index,1);
      if(state.recordDetailId===deletedId) state.recordDetailId=null;
      renderRecords();toast('删除成功');
    });
  }


  function openConsumptionModal(index,preferredLevel='all',preferredRole='能源消费'){
    const current = index===null ? null : state.consumption[index];
    const role=current?.dataType || preferredRole || '能源消费';
    let effectiveLevel = current ? (current.level==='企业'?'enterprise':current.level==='一级用能单元'?'level1':'level2') : preferredLevel;
    if(index===null && effectiveLevel==='all' && role!=='能源消费') effectiveLevel='level2';

    const roleCandidates=()=>{
      let items=unitsByLevel(effectiveLevel);
      if(role==='能源产出'){
        const names=new Set(conversionUnits('').map(item=>item.name));
        items=items.filter(item=>names.has(item.name));
      }else if(role==='回收能源' || role==='外供能源'){
        items=items.filter(item=>item.name!=='全厂');
      }
      return items;
    };

    const candidateUnits = roleCandidates();
    const initialScope = current?.unitName || candidateUnits[0]?.name || (role==='能源消费'?'全厂':'');
    const initialEnergy = current?.energy || (role==='回收能源'?'余热':role==='能源产出'||role==='外供能源'?'电力':state.energy[0]?.name||'');
    const initialMethod = current?.method || '月度填报';
    const scopeOptions=candidateUnits.length
      ? candidateUnits.map(item=>`<option value="${escapeHtml(item.name)}" ${item.name===initialScope?'selected':''}>${escapeHtml(item.parentName?item.parentName+' / '+item.name:item.name)}</option>`).join('')
      : '<option value="">暂无可选范围，请先维护用能单元及能源转换场景</option>';

    const roleHelp={
      '能源消费':'企业级数据用于能源输入控制；一级数据形成分配；二级数据形成利用。',
      '回收能源':'记录余热、回收蒸汽等可再次利用的能源，可作为转换关系投入。',
      '能源产出':'记录锅炉产汽、余热发电、光伏发电等系统的总产出量。',
      '外供能源':'记录向企业边界外输出的能源，系统自动形成外部输出。'
    };

    openModal(index===null?`新增${role}`:`编辑${role}`,`
      <div class="form-grid">
        <div class="context-strip">
          <span>数据角色：<strong>${escapeHtml(role)}</strong></span>
          <span class="context-divider"></span>
          <span>${escapeHtml(roleHelp[role])}</span>
        </div>
        <div>
          <label class="required" for="dataScope">归属范围</label>
          <select id="dataScope">${scopeOptions}</select>
          ${role==='能源产出'?'<div class="help">仅显示已设置能源转换场景的锅炉、余热发电、光伏等系统。</div>':''}
        </div>
        <div>
          <label class="required" for="dataEnergy">能源品种</label>
          <select id="dataEnergy">${groupedEnergyOptions(initialEnergy)}</select>
        </div>

        <div class="auto-info">
          <span>能流阶段：<strong id="autoStage">—</strong></span>
          <span>分析类别：<strong id="autoCategory">—</strong></span>
          <span>计量单位：<strong id="autoUnit">—</strong></span>
          <span>归属层级：<strong id="autoLevel">—</strong></span>
        </div>

        <div class="full">
          <label class="required">填报口径</label>
          <div class="choice-row">
            <button class="choice ${initialMethod==='月度填报'?'active':''}" data-record-method="月度填报" type="button">按月填报</button>
            <button class="choice ${initialMethod==='年度填报'?'active':''}" data-record-method="年度填报" type="button">仅填年度值</button>
          </div>
          <input id="recordMethodValue" type="hidden" value="${initialMethod}">
        </div>

        <div id="annualRecordWrap" class="full ${initialMethod==='年度填报'?'':'custom-row'}">
          <label class="required" for="annualRecordValue">年度能源量</label>
          <input id="annualRecordValue" type="number" min="0" step="0.01"
            value="${current?.annual ?? ''}" placeholder="请输入年度值">
        </div>
      </div>

      <div id="monthlyRecordWrap" class="${initialMethod==='月度填报'?'':'custom-row'}">
        <div class="form-section-title">月度数据</div>
        ${optionalMonthInputs(current?.m)}
        <div class="summary-line">当前合计：<strong id="recordLiveTotal">0</strong> <span id="recordTotalUnit"></span></div>
      </div>
    `,()=>{
      const energy = state.energy.find(item=>item.name===$('#dataEnergy').value);
      if(!energy) return alert('请选择能源品种。');

      const scope = $('#dataScope').value;
      if(!scope) return alert('请选择归属范围。');
      const scopeItem = allUnits().find(item=>item.name===scope);
      const method = $('#recordMethodValue').value;
      let months = [];
      let annual = 0;

      if(method==='月度填报'){
        months = readOptionalMonths();
        if(!months.some(value=>value!==null)) return alert('请至少填写一个月份的数据。');
      }else{
        const annualRaw = $('#annualRecordValue').value.trim();
        if(annualRaw==='') return alert('请填写年度能源量。');
        annual = Number(annualRaw);
      }

      const duplicate = state.consumption.some((item,i)=>
        i!==index && item.dataType===role && String(item.year)===String(state.filters.consumption.year) &&
        item.unitName===scope && item.energy===energy.name
      );
      if(duplicate) return alert(`同一归属范围和能源品种已存在${role}记录，请直接编辑原记录。`);

      const item = {
        id:current?.id || nextId++,year:Number(state.filters.consumption.year),
        level:scopeItem?.level || '企业',unitName:scope,
        dataType:role,
        category:energy.category,energy:energy.name,unit:energy.unit,
        method,annual,m:months
      };

      if(index===null) state.consumption.push(item);
      else state.consumption[index] = item;
      closeModal();renderRecords();toast(`${role}已保存`);
    });

    const updateAutoInfo = ()=>{
      const energy = state.energy.find(item=>item.name===$('#dataEnergy').value);
      const scope = allUnits().find(item=>item.name===$('#dataScope').value);
      $('#autoCategory').textContent = energy?.category || '—';
      $('#autoUnit').textContent = energy?.unit || '—';
      $('#autoLevel').textContent = scope?.level || '—';
      $('#autoStage').textContent = energyRoleStage(role,scope?.level||'企业');
      $('#recordTotalUnit').textContent = energy?.unit || '';
    };
    const updateLiveTotal = ()=>{
      const total = Array.from({length:12},(_,i)=>{
        const raw = $('#m'+i)?.value.trim() || '';
        return raw==='' ? 0 : Number(raw);
      }).reduce((a,b)=>a+b,0);
      $('#recordLiveTotal').textContent = fmt(total);
    };

    document.querySelectorAll('[data-record-method]').forEach(button=>{
      button.addEventListener('click',()=>{
        document.querySelectorAll('[data-record-method]').forEach(item=>item.classList.remove('active'));
        button.classList.add('active');
        const method = button.dataset.recordMethod;
        $('#recordMethodValue').value = method;
        $('#monthlyRecordWrap').classList.toggle('custom-row',method!=='月度填报');
        $('#annualRecordWrap').classList.toggle('custom-row',method!=='年度填报');
      });
    });
    $('#dataScope').addEventListener('change',updateAutoInfo);
    $('#dataEnergy').addEventListener('change',updateAutoInfo);
    Array.from({length:12},(_,i)=>$('#m'+i)).forEach(input=>{
      if(input) input.addEventListener('input',updateLiveTotal);
    });
    updateAutoInfo();
    updateLiveTotal();
  }

  function relationRecord(id){
    return state.consumption.find(item=>item.id===Number(id));
  }

  function relationRecordLabel(item){
    if(!item) return '—';
    return `${item.unitName}｜${item.energy}｜${item.dataType}｜${item.year}`;
  }

  function relationRecordOptions(selectedId='',types=[],placeholder='请选择已有能源数据'){
    const year = Number(state.filters.flows.year);
    const candidates = state.consumption.filter(item=>
      (!types.length || types.includes(item.dataType)) &&
      (!year || Number(item.year)===year)
    );
    return `<option value="">${escapeHtml(placeholder)}</option>` + candidates.map(item=>`
      <option value="${item.id}" ${Number(selectedId)===item.id?'selected':''}>${escapeHtml(relationRecordLabel(item))}</option>
    `).join('');
  }

  function recordTce(item){
    if(!item) return 0;
    const energy = state.energy.find(row=>row.name===item.energy);
    if(!energy) return 0;
    const amount = recordAnnual(item);
    return String(energy.factorUnit||'').startsWith('kgce/')
      ? amount * Number(energy.factor||0) / 1000
      : amount * Number(energy.factor||0);
  }

  function recordHasFactor(item){
    const energy = state.energy.find(row=>row.name===item?.energy);
    return !!energy && Number(energy.factor||0)>0;
  }

  function relationInputs(item){
    const ids = item.inputRecordIds || (item.inputRecordId && item.inputRecordId!=='none' ? [item.inputRecordId] : []);
    return ids.map(relationRecord).filter(Boolean);
  }

  function relationOutputs(item){
    const ids = item.outputRecordIds || (item.outputRecordId ? [item.outputRecordId] : []);
    return ids.map(relationRecord).filter(Boolean);
  }

  function relationScenario(item){
    return item.sceneType || (relationInputs(item).length ? '其他转换' : '自发电');
  }

  function relationStatus(item){
    const inputs=relationInputs(item);
    const outputs=relationOutputs(item);
    if(!outputs.length) return {text:'待补充产出',className:'orange'};
    const all=[...inputs,...outputs];
    if(all.some(record=>Number(record.year)!==Number(item.year))) return {text:'期间不一致',className:'orange'};
    if(all.some(record=>!recordHasFactor(record))) return {text:'缺少折标参数',className:'orange'};
    return {text:inputs.length?'可计算':'可生成关系',className:''};
  }

  function relationEfficiency(item){
    const inputs=relationInputs(item);
    const outputs=relationOutputs(item);
    if(!inputs.length || !outputs.length) return null;
    const inputTce=inputs.reduce((total,row)=>total+recordTce(row),0);
    const outputTce=outputs.reduce((total,row)=>total+recordTce(row),0);
    return inputTce>0 ? outputTce/inputTce*100 : null;
  }

  function relationLoss(item){
    const efficiency=relationEfficiency(item);
    if(efficiency===null) return null;
    const inputTce=relationInputs(item).reduce((total,row)=>total+recordTce(row),0);
    const outputTce=relationOutputs(item).reduce((total,row)=>total+recordTce(row),0);
    return Math.max(inputTce-outputTce,0);
  }

  function relationInputText(item){
    const inputs=relationInputs(item);
    return inputs.length ? inputs.map(row=>row.energy).join(' + ') : '无可计量投入';
  }

  function relationOutputText(item){
    const outputs=relationOutputs(item);
    return outputs.length ? outputs.map(row=>row.energy).join(' + ') : '—';
  }

  function relationPreview(item){
    return `${relationInputText(item)} → ${item.processUnit||'转换/生产单元'} → ${relationOutputText(item)}`;
  }

  function externalOutputRecords(){
    return state.consumption.filter(item=>
      item.dataType==='外供能源' && String(item.year)===String(state.filters.flows.year)
    );
  }


  function flowContent(){
    const f=state.filters.flows;
    const list=state.flows.filter(item=>{
      const searchText=[item.processUnit,relationScenario(item),relationInputText(item),relationOutputText(item),item.remark].join(' ');
      return String(item.year)===String(f.year) &&
        (!f.unitName || item.processUnit===f.unitName || relationInputs(item).some(row=>row.unitName===f.unitName) || relationOutputs(item).some(row=>row.unitName===f.unitName)) &&
        (!f.keyword || searchText.includes(f.keyword));
    });
    const external=externalOutputRecords();
    const rows=[];

    list.forEach(item=>{
      const index=state.flows.findIndex(row=>row.id===item.id);
      const status=relationStatus(item);
      const detailOpen=state.flowDetailId===item.id;
      const inputs=relationInputs(item);
      const outputs=relationOutputs(item);
      const efficiency=relationEfficiency(item);
      const loss=relationLoss(item);
      rows.push(`
        <tr>
          <td>${escapeHtml(relationScenario(item))}</td>
          <td>${escapeHtml(item.processUnit)}</td>
          <td>${escapeHtml(relationInputText(item))}</td>
          <td>${escapeHtml(relationOutputText(item))}</td>
          <td>${item.year}</td>
          <td><span class="tag ${status.className}">${status.text}</span></td>
          <td>
            <button class="btn-link detail-flow" data-id="${item.id}" type="button">${detailOpen?'收起':'查看'}</button>
            <button class="btn-link edit-flow" data-index="${index}" type="button">编辑</button>
            <button class="btn-link danger delete-flow" data-index="${index}" type="button">删除</button>
          </td>
        </tr>
      `);
      if(detailOpen){
        rows.push(`
          <tr class="detail-row"><td colspan="7"><div class="detail-panel">
            <div class="detail-head"><span>${escapeHtml(relationPreview(item))}</span><span>${escapeHtml(relationScenario(item))}</span></div>
            <div class="relation-summary">
              <div class="relation-summary-item"><div class="relation-summary-label">投入折标量</div><div class="relation-summary-value">${inputs.length?fmt(inputs.reduce((t,r)=>t+recordTce(r),0),1)+' tce':'不适用'}</div></div>
              <div class="relation-summary-item"><div class="relation-summary-label">产出折标量</div><div class="relation-summary-value">${fmt(outputs.reduce((t,r)=>t+recordTce(r),0),1)} tce</div></div>
              <div class="relation-summary-item"><div class="relation-summary-label">转换效率</div><div class="relation-summary-value">${efficiency===null?'不计算':fmt(efficiency,1)+'%'}</div></div>
              <div class="relation-summary-item"><div class="relation-summary-label">转换损失</div><div class="relation-summary-value">${loss===null?'不计算':fmt(loss,1)+' tce'}</div></div>
            </div>
            <div class="summary-line">投入：${inputs.length?inputs.map(relationRecordLabel).map(escapeHtml).join('；'):'无可计量投入'}<br>产出：${outputs.map(relationRecordLabel).map(escapeHtml).join('；')}</div>
          </div></td></tr>
        `);
      }
    });

    return `
      ${toolbar(`
        <div class="field"><label for="flowYear">年度</label><select id="flowYear">${selectOptions(['2026','2025'],f.year)}</select></div>
        <div class="field"><label for="flowUnitFilter">转换单元</label><select id="flowUnitFilter"><option value="">全部</option>${conversionUnitOptions('',f.unitName)}</select></div>
        <div class="field search"><label for="flowKeyword">关键字</label><input id="flowKeyword" value="${escapeHtml(f.keyword)}" placeholder="搜索场景、转换单元或能源品种"></div>
      `,'新增能源转换关系')}
      <div class="notice">
        <strong>仅在这里配置真实发生的能源转换：</strong>锅炉产汽/产热、余热发电、自发电或其他转换。外购能源由企业级能源消费识别，一级和二级消费分别形成能源分配与利用，外供能源由系统自动识别。
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>转换场景</th><th>转换单元</th><th>投入能源</th><th>产出能源</th><th>数据期间</th><th>计算状态</th><th>操作</th></tr></thead>
        <tbody>${rows.length?rows.join(''):tableEmpty(7)}</tbody>
      </table></div>${pagination(list.length)}
      <div class="readonly-section">
        <div class="section-toolbar"><div><div class="section-toolbar-title">已识别的外部输出</div><div class="section-toolbar-desc">来源于能源量数据中的“外供能源”记录，无需再次建立转换关系。</div></div><span class="tag orange">${external.length} 条</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>来源单元</th><th>能源品种</th><th>能流阶段</th><th>年度</th><th>年度外供量</th><th>单位</th><th>处理方式</th></tr></thead>
          <tbody>${external.length?external.map(row=>`<tr><td>${escapeHtml(row.unitName)}</td><td>${escapeHtml(row.energy)}</td><td><span class="stage-pill">外部输出</span></td><td>${row.year}</td><td>${fmt(recordAnnual(row))}</td><td>${escapeHtml(row.unit)}</td><td>系统自动识别</td></tr>`).join(''):tableEmpty(7)}</tbody>
        </table></div>
      </div>
    `;
  }

  function bindFlows(){
    $('#addBtn').addEventListener('click',()=>openFlowModal(null));
    $('#flowYear').addEventListener('change',event=>{state.filters.flows.year=event.target.value;renderRecords();});
    $('#flowUnitFilter').addEventListener('change',event=>{state.filters.flows.unitName=event.target.value;renderRecords();});
    $('#flowKeyword').addEventListener('input',event=>{state.filters.flows.keyword=event.target.value;renderRecords();});
    document.querySelectorAll('.detail-flow').forEach(button=>button.addEventListener('click',()=>{
      const id=Number(button.dataset.id);state.flowDetailId=state.flowDetailId===id?null:id;renderRecords();
    }));
    document.querySelectorAll('.edit-flow').forEach(button=>button.addEventListener('click',()=>openFlowModal(Number(button.dataset.index))));
    document.querySelectorAll('.delete-flow').forEach(button=>button.addEventListener('click',()=>{
      const index=Number(button.dataset.index);

      const id=state.flows[index].id;state.flows.splice(index,1);
      if(state.flowDetailId===id) state.flowDetailId=null;
      renderRecords();toast('删除成功');
    }));
  }


  function openFlowModal(index){
    const current=index===null?null:state.flows[index];
    let scene=current?.sceneType || (current?.scenario==='无投入自产'?'自发电':'余热发电');
    let inputIds=(current?.inputRecordIds||[]).slice();
    let outputIds=(current?.outputRecordIds||[]).slice();
    let processUnit=current?.processUnit || '';

    const sceneDefaults={
      '锅炉产汽/产热':{unit:'燃气锅炉',inputs:[36],outputs:[37]},
      '余热发电':{unit:'余热发电系统',inputs:[34],outputs:[33]},
      '自发电':{unit:'分布式光伏系统',inputs:[],outputs:[38]},
      '其他转换':{unit:conversionUnits('')[0]?.name||'',inputs:[],outputs:[]}
    };
    if(index===null){
      const d=sceneDefaults[scene];
      processUnit=d.unit;inputIds=d.inputs.slice();outputIds=d.outputs.slice();
    }
    if(!outputIds.length) outputIds=[''];

    const sceneCards=[
      ['锅炉产汽/产热','燃料 → 锅炉 → 蒸汽/热水'],
      ['余热发电','回收余热 → 余热发电 → 电力'],
      ['自发电','光伏/风电等 → 电力'],
      ['其他转换','其他一进一出或多投入/多产出场景']
    ];

    openModal(index===null?'新增能源转换关系':'编辑能源转换关系',`
      <div class="form-grid">
        <div class="full">
          <label class="required">选择转换场景</label>
          <div class="scene-grid">
            ${sceneCards.map(([key,desc])=>`<button class="scene-card ${scene===key?'active':''}" data-scene="${key}" type="button"><strong>${key}</strong><span>${desc}</span></button>`).join('')}
          </div>
          <input id="relationSceneValue" type="hidden" value="${scene}">
        </div>

        <div class="full">
          <label class="required" for="flowProcessUnit">转换单元</label>
          <select id="flowProcessUnit"></select>
          <div class="help" id="processUnitHelp">只显示已在“用能单元”中设置为当前转换场景的系统。</div>
        </div>

        <div class="full relation-section">
          <div class="relation-section-head">
            <div>
              <div class="relation-section-title">关联已有能源量数据</div>
              <div class="relation-section-desc" id="relationSceneDesc">系统根据转换场景筛选可选的投入与产出数据。</div>
            </div>
          </div>
          <div class="simple-relation-grid">
            <div id="primaryInputWrap">
              <label id="primaryInputLabel">投入能源数据</label>
              <select id="primaryInput"></select>
            </div>
            <div class="relation-arrow">→</div>
            <div>
              <label class="required">产出能源数据</label>
              <select id="primaryOutput"></select>
            </div>
          </div>
          <button class="advanced-link" id="toggleAdvancedRelation" type="button">需要多种投入或多种产出？展开高级关联</button>
          <div class="advanced-box" id="advancedRelationBox">
            <div class="relation-section-head" style="margin-bottom:8px">
              <div><div class="relation-section-title">其他投入与产出</div><div class="relation-section-desc">一期常规场景通常无需使用。</div></div>
              <div><button class="btn" id="addInputRelation" type="button">＋ 其他投入</button> <button class="btn" id="addOutputRelation" type="button">＋ 其他产出</button></div>
            </div>
            <div class="relation-editor" id="extraInputRows"></div>
            <div class="relation-editor" id="extraOutputRows" style="margin-top:10px"></div>
          </div>
        </div>

        <div class="full relation-preview">
          关系预览：<strong id="relationPreviewText">—</strong><br>
          <span id="relationCalcText">选择数据后自动校验期间、折标参数和转换效率。</span>
        </div>

        <div class="full">
          <label for="flowRemark">备注</label>
          <textarea id="flowRemark" placeholder="选填，可说明关系口径或数据来源">${escapeHtml(current?.remark||'')}</textarea>
        </div>

        <div class="full notice" style="margin:0">
          本页只关联已有能源量数据，不重复填月度数值。外购能源、一级分配、二级利用和外部输出均由系统从能源量数据中自动形成。
        </div>
      </div>
    `,()=>{
      const selectedScene=$('#relationSceneValue').value;
      const selectedProcess=$('#flowProcessUnit').value;
      const primaryInput=$('#primaryInput').value ? [Number($('#primaryInput').value)] : [];
      const primaryOutput=$('#primaryOutput').value ? [Number($('#primaryOutput').value)] : [];
      const extraInputs=Array.from(document.querySelectorAll('#extraInputRows select')).map(s=>Number(s.value)).filter(Boolean);
      const extraOutputs=Array.from(document.querySelectorAll('#extraOutputRows select')).map(s=>Number(s.value)).filter(Boolean);
      const selectedInputs=selectedScene==='自发电'?[]:[...primaryInput,...extraInputs];
      const selectedOutputs=[...primaryOutput,...extraOutputs];

      if(!selectedProcess) return alert('请选择转换单元。');
      if(selectedScene!=='自发电' && !selectedInputs.length) return alert('请选择投入能源数据。');
      if(!selectedOutputs.length) return alert('请选择产出能源数据。');
      if(new Set(selectedInputs).size!==selectedInputs.length || new Set(selectedOutputs).size!==selectedOutputs.length) return alert('同一能源数据不能重复选择。');

      const all=[...selectedInputs,...selectedOutputs].map(relationRecord).filter(Boolean);
      if(all.some(row=>Number(row.year)!==Number(state.filters.flows.year))) return alert('投入与产出数据必须属于当前年度。');
      if(selectedOutputs.some(id=>relationRecord(id)?.unitName!==selectedProcess)) return alert('产出能源数据应归属于所选转换单元。');
      const duplicate=state.flows.some((row,i)=>i!==index && (row.outputRecordIds||[]).some(id=>selectedOutputs.includes(Number(id))));
      if(duplicate) return alert('所选产出能源数据已被其他转换关系引用，请编辑原关系。');

      const item={
        id:current?.id||nextId++,year:Number(state.filters.flows.year),processUnit:selectedProcess,
        sceneType:selectedScene,scenario:selectedScene==='自发电'?'无投入自产':'能源转换',
        inputRecordIds:selectedInputs,outputRecordIds:selectedOutputs,
        remark:$('#flowRemark').value.trim()
      };
      if(index===null) state.flows.push(item); else state.flows[index]=item;
      closeModal();renderRecords();toast('能源转换关系已保存');
    });

    function candidates(kind){
      const year=Number(state.filters.flows.year);
      return state.consumption.filter(row=>{
        if(Number(row.year)!==year) return false;
        if(kind==='output' && row.unitName!==processUnit) return false;
        if(scene==='锅炉产汽/产热'){
          return kind==='input'
            ? row.dataType==='能源消费' && ['化石燃料','可再生及替代能源'].includes(row.category)
            : row.dataType==='能源产出' && ['蒸汽','热水'].includes(row.energy);
        }
        if(scene==='余热发电'){
          return kind==='input'
            ? row.dataType==='回收能源'
            : row.dataType==='能源产出' && row.energy==='电力';
        }
        if(scene==='自发电'){
          return kind==='input'
            ? false
            : row.dataType==='能源产出' && row.energy==='电力';
        }
        return kind==='input'
          ? ['能源消费','回收能源'].includes(row.dataType)
          : row.dataType==='能源产出';
      });
    }

    function optionHtml(kind,selectedId='',placeholder='请选择已有能源数据'){
      return `<option value="">${placeholder}</option>`+candidates(kind).map(row=>`<option value="${row.id}" ${Number(selectedId)===row.id?'selected':''}>${escapeHtml(relationRecordLabel(row))}</option>`).join('');
    }

    function renderUnitOptions(){
      const list=conversionUnits(scene);
      if(!list.some(item=>item.name===processUnit)) processUnit=list[0]?.name||'';
      $('#flowProcessUnit').innerHTML=conversionUnitOptions(scene,processUnit);
      $('#flowProcessUnit').value=processUnit;
      $('#processUnitHelp').textContent=list.length
        ? `已按“${scene}”筛选 ${list.length} 个可选单元。`
        : `暂无“${scene}”单元，请先在用能单元中设置能源转换场景。`;
    }

    function renderPrimary(){
      const noInput=scene==='自发电';
      $('#primaryInputWrap').style.display=noInput?'none':'block';
      $('.relation-arrow').style.display=noInput?'none':'grid';
      $('#primaryInput').innerHTML=optionHtml('input',inputIds[0]||'',
        scene==='余热发电'?'请选择回收余热数据':scene==='锅炉产汽/产热'?'请选择燃料消费数据':'请选择投入能源数据');
      $('#primaryOutput').innerHTML=optionHtml('output',outputIds[0]||'',
        scene==='锅炉产汽/产热'?'请选择蒸汽或热水产出':scene==='余热发电'||scene==='自发电'?'请选择电力产出数据':'请选择能源产出数据');
      $('#primaryInputLabel').textContent=scene==='余热发电'?'回收余热数据':scene==='锅炉产汽/产热'?'燃料消费数据':'投入能源数据';
      $('#relationSceneDesc').textContent={
        '锅炉产汽/产热':'选择锅炉使用的燃料消费数据和蒸汽/热水总产出数据。',
        '余热发电':'选择回收余热数据和余热发电系统的电力总产出数据。',
        '自发电':'无需选择燃料投入，只关联光伏、风电等系统的电力产出数据。',
        '其他转换':'选择已有投入与产出能源数据，必要时使用高级关联。'
      }[scene];
      $('#primaryInput').addEventListener('change',syncPreview);
      $('#primaryOutput').addEventListener('change',syncPreview);
    }

    function extraRow(kind,id,index){
      return `<div class="relation-row"><div><label>${kind==='input'?'其他投入':'其他产出'}</label><select>${optionHtml(kind,id,kind==='input'?'请选择其他投入':'请选择其他产出')}</select></div><button class="btn remove-extra" data-kind="${kind}" data-index="${index}" type="button">×</button></div>`;
    }

    function renderExtras(){
      const extraInputs=inputIds.slice(1);
      const extraOutputs=outputIds.slice(1);
      $('#extraInputRows').innerHTML=extraInputs.map((id,i)=>extraRow('input',id,i)).join('');
      $('#extraOutputRows').innerHTML=extraOutputs.map((id,i)=>extraRow('output',id,i)).join('');
      document.querySelectorAll('#advancedRelationBox select').forEach(s=>s.addEventListener('change',syncPreview));
      document.querySelectorAll('.remove-extra').forEach(button=>button.addEventListener('click',()=>{
        const target=button.dataset.kind==='input'?inputIds:outputIds;
        target.splice(Number(button.dataset.index)+1,1);
        renderExtras();syncPreview();
      }));
      if(extraInputs.length||extraOutputs.length) $('#advancedRelationBox').classList.add('show');
    }

    function selectedRows(){
      const ins=scene==='自发电'?[]:[
        relationRecord($('#primaryInput').value),
        ...Array.from(document.querySelectorAll('#extraInputRows select')).map(s=>relationRecord(s.value))
      ].filter(Boolean);
      const outs=[
        relationRecord($('#primaryOutput').value),
        ...Array.from(document.querySelectorAll('#extraOutputRows select')).map(s=>relationRecord(s.value))
      ].filter(Boolean);
      return {ins,outs};
    }

    function syncPreview(){
      processUnit=$('#flowProcessUnit').value||processUnit;
      const {ins,outs}=selectedRows();
      const inputText=ins.length?ins.map(r=>r.energy).join(' + '):(scene==='自发电'?'自然能源':'待选择');
      const outputText=outs.length?outs.map(r=>r.energy).join(' + '):'待选择';
      $('#relationPreviewText').textContent=`${inputText} → ${processUnit||'转换单元'} → ${outputText}`;
      const inputTce=ins.reduce((t,r)=>t+recordTce(r),0);
      const outputTce=outs.reduce((t,r)=>t+recordTce(r),0);
      const all=[...ins,...outs];
      if(scene==='自发电'){
        $('#relationCalcText').textContent=`产出折标量 ${fmt(outputTce,1)} tce；自发电场景不计算燃料转换效率。`;
      }else if(ins.length&&outs.length&&all.every(recordHasFactor)){
        $('#relationCalcText').textContent=`投入 ${fmt(inputTce,1)} tce；产出 ${fmt(outputTce,1)} tce；转换效率 ${inputTce?fmt(outputTce/inputTce*100,1):'—'}%。`;
      }else{
        $('#relationCalcText').textContent='选择完整数据后，系统自动计算折标投入、产出和转换效率。';
      }
    }

    function applyScene(nextScene,applyDefaults=true){
      scene=nextScene;$('#relationSceneValue').value=scene;
      document.querySelectorAll('[data-scene]').forEach(card=>card.classList.toggle('active',card.dataset.scene===scene));
      if(applyDefaults){
        const d=sceneDefaults[scene];
        processUnit=d.unit;inputIds=d.inputs.slice();outputIds=d.outputs.slice();
        if(!outputIds.length) outputIds=[''];
      }
      renderUnitOptions();renderPrimary();renderExtras();syncPreview();
    }

    document.querySelectorAll('[data-scene]').forEach(card=>card.addEventListener('click',()=>applyScene(card.dataset.scene,true)));
    $('#flowProcessUnit').addEventListener('change',()=>{
      processUnit=$('#flowProcessUnit').value;
      renderPrimary();renderExtras();syncPreview();
    });
    $('#toggleAdvancedRelation').addEventListener('click',()=>$('#advancedRelationBox').classList.toggle('show'));
    $('#addInputRelation').addEventListener('click',()=>{inputIds.push('');renderExtras();syncPreview();});
    $('#addOutputRelation').addEventListener('click',()=>{outputIds.push('');renderExtras();syncPreview();});
    applyScene(scene,false);
  }

  function costContent(){
    const f = state.filters.costs;
    const list = state.costs.filter(item=>
      String(item.year)===String(f.year) &&
      (!f.energy || item.energy===f.energy)
    );

    return `
      ${toolbar(`
        <div class="field">
          <label for="costYear">年度</label>
          <select id="costYear">${selectOptions(['2026','2025'],f.year)}</select>
        </div>
        <div class="field">
          <label for="costEnergy">能源品种</label>
          <select id="costEnergy"><option value="">全部</option>${energyOptions(f.energy)}</select>
        </div>
      `,'新增成本数据')}
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>能源品种</th><th>1月成本（万元）</th><th>2月</th>

            </tr>
          </thead>

            ${list.length?list.map(item=>{
              const index = state.costs.findIndex(row=>row.id===item.id);

                <tr>
