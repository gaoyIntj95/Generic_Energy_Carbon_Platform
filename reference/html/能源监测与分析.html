<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通用能碳平台｜能源监测与分析</title>
  <style>
    :root{
      --brand:#00A870;
      --brand-dark:#00875A;
      --brand-soft:#EAF8F3;
      --blue:#1677FF;
      --blue-soft:#EEF5FF;
      --orange:#F79009;
      --orange-soft:#FFF6E8;
      --red:#F04438;
      --red-soft:#FFF0EF;
      --purple:#7A5AF8;
      --purple-soft:#F2EEFF;
      --nav:#0F2740;
      --nav-2:#102F4E;
      --bg:#F4F7F8;
      --card:#FFFFFF;
      --text:#172033;
      --text-2:#5F6B7A;
      --muted:#8A94A3;
      --border:#E2E8EF;
      --table-head:#F5F8FA;
      --shadow:0 2px 10px rgba(20,45,70,.06);
      --radius:10px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);background:var(--bg)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{display:flex;min-height:100vh}
    .sidebar{width:228px;background:linear-gradient(180deg,var(--nav),#0B2238);color:#fff;position:fixed;inset:0 auto 0 0;z-index:20;display:flex;flex-direction:column}
    .brand{height:66px;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);font-size:17px;font-weight:700;letter-spacing:.2px}
    .brand-logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#00C389,#2E7CF6);font-size:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
    .side-scroll{padding:14px 10px 16px;overflow:auto}
    .side-item,.side-group-title,.sub-item{width:100%;border:0;color:#C8D3DF;background:transparent;border-radius:7px;text-align:left;display:flex;align-items:center;gap:10px;transition:.16s}
    .side-item,.side-group-title{height:42px;padding:0 12px;font-size:14px}
    .side-item:hover,.side-group-title:hover,.sub-item:hover{background:rgba(255,255,255,.07);color:#fff}
    .side-group{margin-top:6px}
    .side-group-title{justify-content:space-between;color:#E2E8F0}
    .side-group-title .left{display:flex;align-items:center;gap:10px}
    .chevron{transition:.2s;font-size:12px}
    .side-group.open .chevron{transform:rotate(180deg)}
    .sub-menu{display:none;padding:2px 0 4px 17px}
    .side-group.open .sub-menu{display:block}
    .sub-item{height:38px;padding:0 12px 0 20px;font-size:14px;position:relative}
    .sub-item::before{content:"";position:absolute;left:8px;width:4px;height:4px;border-radius:50%;background:#8EA0B5}
    .sub-item.active{background:linear-gradient(90deg,rgba(0,168,112,.95),rgba(0,168,112,.72));color:#fff;font-weight:600}
    .sub-item.active::before{background:#fff}
    .sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.08);color:#AFC0D2;font-size:13px;display:flex;align-items:center;gap:9px}
    .main{margin-left:228px;width:calc(100% - 228px);min-width:0}
    .topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}
    .top-left{display:flex;align-items:center;gap:14px;color:var(--text-2);font-size:14px}
    .collapse-btn{border:0;background:transparent;font-size:22px;color:var(--text-2);padding:4px 6px;border-radius:6px}
    .collapse-btn:hover{background:#F2F5F7}
    .top-actions{display:flex;align-items:center;gap:16px;color:var(--text-2);font-size:14px}
    .avatar{width:29px;height:29px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
    .content{padding:20px 22px 34px}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:16px}
    .page-title{margin:0;font-size:24px;font-weight:700;letter-spacing:.3px}
    .page-desc{margin-top:6px;color:var(--text-2);font-size:14px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
    .filter-card{padding:16px 18px;margin-bottom:14px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
    .field{min-width:170px}
    .field.wide{min-width:220px}
    .field label{display:block;margin-bottom:6px;color:var(--text-2);font-size:13px}
    select,input{width:100%;height:38px;border:1px solid #D7DEE7;border-radius:7px;background:#fff;color:var(--text);padding:0 11px;outline:none}
    select:focus,input:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,168,112,.10)}
    .seg{display:flex;height:38px;border:1px solid #D7DEE7;border-radius:7px;overflow:hidden;background:#fff}
    .seg button{border:0;background:#fff;color:var(--text-2);padding:0 16px;border-right:1px solid #D7DEE7}
    .seg button:last-child{border-right:0}
    .seg button.active{background:var(--brand);color:#fff}
    .filter-spacer{flex:1}
    .btn{height:38px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text-2);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
    .btn:hover{border-color:var(--brand);color:var(--brand)}
    .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn-primary:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
    .btn-outline-brand{border-color:#8AD8BB;color:var(--brand-dark);background:#fff}
    .more-link{height:38px;border:0;background:transparent;color:var(--blue);padding:0 6px}
    .more-filter{display:none;flex-basis:100%;padding-top:12px;border-top:1px dashed var(--border);gap:16px;flex-wrap:wrap}
    .more-filter.open{display:flex}
    .section-title{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
    .section-title::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand)}
    .summary-strip{display:grid;grid-template-columns:1.25fr .8fr .8fr 1.4fr .8fr;align-items:center;min-height:76px;padding:0 22px;margin-bottom:14px;background:linear-gradient(90deg,#F1FBF7,#FFFFFF)}
    .summary-item{padding:0 20px;border-right:1px solid #DDE9E4}
    .summary-item:first-child{padding-left:0}
    .summary-item:last-child{border-right:0}
    .summary-label{font-size:13px;color:var(--text-2)}
    .summary-value{margin-top:5px;font-size:21px;font-weight:700;color:var(--brand-dark)}
    .summary-value.big{font-size:27px}
    .summary-value.red{color:var(--red)}
    .summary-value.green{color:var(--brand-dark)}
    .summary-value.orange{color:var(--orange)}
    .unit{font-size:13px;color:var(--text-2);font-weight:500;margin-left:5px}
    .up{color:var(--red)}
    .down{color:var(--brand)}
    .grid-2{display:grid;grid-template-columns:1.3fr .9fr;gap:14px;margin-bottom:14px}
    .chart-card{padding:16px 18px;min-height:300px}
    .chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .chart-title{font-size:16px;font-weight:700}
    .chart-sub{font-size:12px;color:var(--muted);margin-top:3px}
    .bar-chart{height:230px;display:flex;align-items:flex-end;gap:24px;padding:22px 24px 30px;border-left:1px solid #DDE3EA;border-bottom:1px solid #DDE3EA;position:relative}
    .bar-chart::before,.bar-chart::after{content:"";position:absolute;left:0;right:0;border-top:1px dashed #E4E9EF}
    .bar-chart::before{top:35%}.bar-chart::after{top:65%}
    .bar-item{flex:1;min-width:28px;text-align:center;position:relative;z-index:1}
    .bar{width:36px;max-width:90%;margin:0 auto;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#3EC181,#1BA66C);transition:.25s;position:relative}
    .bar:hover{filter:brightness(.95);transform:translateY(-2px)}
    .bar-value{position:absolute;left:50%;transform:translateX(-50%);top:-23px;font-size:12px;color:var(--text);white-space:nowrap}
    .bar-label{margin-top:8px;color:var(--text-2);font-size:12px}
    .donut-wrap{display:flex;align-items:center;justify-content:center;gap:36px;height:240px}
    .donut{width:180px;height:180px;border-radius:50%;background:conic-gradient(var(--brand) 0 46%,var(--blue) 46% 78%,var(--orange) 78% 93%,var(--purple) 93%);position:relative;display:grid;place-items:center}
    .donut::after{content:"";position:absolute;width:94px;height:94px;border-radius:50%;background:#fff}
    .donut-center{position:relative;z-index:1;text-align:center;font-weight:700;font-size:20px}
    .donut-center small{display:block;color:var(--text-2);font-size:12px;font-weight:500;margin-top:3px}
    .legend{min-width:210px}
    .legend-row{display:grid;grid-template-columns:12px 1fr 64px 80px;align-items:center;gap:8px;padding:8px 0;font-size:13px}
    .dot{width:10px;height:10px;border-radius:50%}
    .table-card{padding:14px 16px;margin-bottom:14px}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:860px}
    th,td{height:46px;padding:0 12px;border-bottom:1px solid #E8EDF2;text-align:left;font-size:13px;white-space:nowrap}
    th{background:var(--table-head);color:#4B5665;font-weight:600}
    tbody tr:hover td{background:#FBFDFC}
    tfoot td{background:#F1F8F5;font-weight:700}
    .status{display:inline-flex;align-items:center;justify-content:center;height:25px;padding:0 10px;border-radius:13px;font-size:12px}
    .status.ok{background:#E7F7EF;color:var(--brand-dark)}
    .status.warn{background:#FFF1D8;color:#B54708}
    .status.check{background:#EAF2FF;color:#1769C2}
    .status.bad{background:#FFE6E4;color:#D92D20}
    .link{border:0;background:transparent;color:var(--blue);padding:2px 4px}
    .pagination{height:48px;display:flex;align-items:center;justify-content:flex-end;gap:9px;color:var(--muted);font-size:13px}
    .page-btn{width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:6px;color:var(--text-2)}
    .page-btn.active{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
    .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
    .metric-card{padding:20px 22px;min-height:136px;display:flex;align-items:center;gap:18px}
    .metric-icon{width:62px;height:62px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:27px;flex:none}
    .metric-name{font-size:15px;color:var(--text-2)}
    .metric-num{font-size:30px;font-weight:700;color:var(--brand-dark);margin-top:7px}
    .metric-sub{font-size:13px;margin-top:8px;color:var(--text-2)}
    .data-note{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:14px 18px;background:#F2F7FF;border:1px solid #D7E6FF;border-radius:9px;color:#365A7A;font-size:13px}
    .data-note>div{padding:0 18px;border-right:1px solid #D7E6FF}
    .data-note>div:last-child{border-right:0}
    .benchmark-overview{display:grid;grid-template-columns:repeat(5,1fr);min-height:150px;margin-bottom:14px;border-left:4px solid var(--blue)}
    .bench-item{padding:28px 28px;border-right:1px solid #E4E9EF}
    .bench-item:last-child{border-right:0}
    .bench-label{color:var(--text-2);font-size:14px}
    .bench-value{font-size:29px;font-weight:700;margin-top:11px}
    .benchmark-grid{display:grid;grid-template-columns:.9fr 1.45fr;gap:14px}
    .line-chart{height:330px;padding:8px 8px 0}
    .line-chart svg{width:100%;height:100%;display:block}
    .flow-summary{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;min-height:78px;margin-bottom:14px}
    .flow-stat{padding:0 28px;border-right:1px solid var(--border);display:flex;align-items:center;gap:14px}
    .flow-stat:last-child{border-right:0}
    .flow-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--blue-soft);color:var(--blue)}
    .flow-stat:nth-child(2) .flow-icon{background:var(--brand-soft);color:var(--brand)}
    .flow-stat:nth-child(3) .flow-icon{background:var(--orange-soft);color:var(--orange)}
    .flow-stat:nth-child(4) .flow-icon{background:var(--purple-soft);color:var(--purple)}
    .flow-main{padding:14px 16px;margin-bottom:14px}
    .sankey{width:100%;height:auto;display:block;min-height:350px}
    .sankey .flow{fill:none;stroke-linecap:round;opacity:.34;transition:.2s}
    .sankey .flow.active{opacity:.82;filter:drop-shadow(0 0 2px rgba(0,0,0,.12))}
    .sankey .node{cursor:pointer;transition:.2s}
    .sankey .node:hover rect,.sankey .node.selected rect{stroke-width:2.5}
    .flow-bottom{display:grid;grid-template-columns:.7fr 1.4fr;gap:14px}
    .rank-card,.flow-table-card{padding:14px 16px}
    .rank-row{display:grid;grid-template-columns:42px 1fr 110px 70px;align-items:center;height:44px;border-bottom:1px solid #E8EDF2;font-size:13px}
    .rank-badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#F1F3F5;color:#667085;font-weight:700}
    .rank-row:nth-child(2) .rank-badge{background:#FFF1D8;color:#B54708}
    .rank-row:nth-child(3) .rank-badge{background:#EEF3FA;color:#5F6B7A}
    .rank-row:nth-child(4) .rank-badge{background:#FFE8D7;color:#C45A11}
    .toast{position:fixed;right:24px;top:72px;z-index:1000;background:#fff;border:1px solid #CBECDD;border-radius:8px;box-shadow:0 10px 30px rgba(20,45,70,.18);padding:12px 16px;color:var(--brand-dark);display:none;align-items:center;gap:8px}
    .toast.show{display:flex}
    .overlay{position:fixed;inset:0;background:rgba(16,24,40,.46);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
    .overlay.open{display:flex}
    .modal{width:min(720px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 22px 60px rgba(16,24,40,.24)}
    .modal-head{height:58px;padding:0 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .modal-title{font-size:17px;font-weight:700}
    .modal-close{border:0;background:transparent;font-size:24px;color:var(--muted)}
    .modal-body{padding:20px}
    .modal-foot{height:62px;padding:0 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;align-items:center;gap:10px}
    .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .detail-box{border:1px solid var(--border);border-radius:8px;padding:12px;background:#FBFCFD}
    .detail-box span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
    .hidden{display:none!important}
    .mobile-menu{display:none}
    @media(max-width:1100px){
      .sidebar{width:76px}.main{margin-left:76px;width:calc(100% - 76px)}
      .brand span,.side-group-title span.label,.side-item span.label,.sub-item span.label,.sidebar-foot span{display:none}
      .brand{justify-content:center;padding:0}.side-group-title,.side-item{justify-content:center;padding:0}.sub-menu{padding-left:0}.sub-item{justify-content:center;padding:0}.sub-item::before{display:none}
      .summary-strip{grid-template-columns:repeat(3,1fr);padding:14px 18px;gap:10px}.summary-item{border-right:0;padding:7px 10px}.grid-2,.benchmark-grid,.flow-bottom{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}.flow-summary{grid-template-columns:1fr 1fr}.flow-stat:nth-child(2){border-right:0}.benchmark-overview{grid-template-columns:repeat(3,1fr)}
    }
    @media(max-width:760px){
      .content{padding:14px}.topbar{padding:0 12px}.page-title{font-size:21px}.filter-card{align-items:stretch}.field,.field.wide{width:100%;min-width:0}.filter-spacer{display:none}.btn{flex:1}.metric-grid{grid-template-columns:1fr}.summary-strip{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}.donut-wrap{flex-direction:column;height:auto;padding:14px}.benchmark-overview{grid-template-columns:1fr 1fr}.flow-summary{grid-template-columns:1fr}.flow-stat{border-right:0;border-bottom:1px solid var(--border);padding:14px 20px}.flow-stat:last-child{border-bottom:0}.data-note{grid-template-columns:1fr}.data-note>div{border-right:0;border-bottom:1px solid #D7E6FF;padding:10px}.data-note>div:last-child{border-bottom:0}.detail-grid{grid-template-columns:1fr}
    }

    /* ===== V2 定稿版补充样式 ===== */
    .page-head .head-action{display:flex;align-items:center;gap:10px}
    .filter-card.simple{align-items:flex-end}
    .filter-card .seg-field{min-width:auto}
    .filter-card .seg-field label{display:block}
    .summary-compact{display:grid;grid-template-columns:1.15fr .7fr .7fr;min-height:88px;margin-bottom:14px;padding:0 22px;background:linear-gradient(90deg,#F1FBF7 0%,#FFF 72%)}
    .summary-compact.annual{grid-template-columns:1.3fr .7fr}
    .summary-compact .summary-item{display:flex;flex-direction:column;justify-content:center}
    .summary-compact .summary-item:first-child{padding-left:4px}
    .summary-compact .summary-value.big{font-size:30px}
    .table-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
    .table-toolbar .meta{margin-top:5px;color:var(--text-2);font-size:13px}
    .slim-note{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 16px;margin-top:14px;background:#F4F8FF;border:1px solid #D9E7FF;border-radius:8px;color:#41627F;font-size:13px}
    .slim-note .note-main{display:flex;align-items:center;gap:10px;min-width:0}
    .slim-note .note-icon{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#E4EEFF;color:var(--blue);font-weight:700;flex:none}
    .slim-note.warning{background:#FFF9ED;border-color:#FCE7B7;color:#7A5818}
    .slim-note.warning .note-icon{background:#FFF0C7;color:var(--orange)}
    .empty-state{padding:56px 20px;text-align:center;color:var(--muted)}
    .empty-state strong{display:block;color:var(--text-2);font-size:15px;margin-bottom:8px}
    .chart-inline-result{display:flex;align-items:center;gap:18px;flex-wrap:wrap;color:var(--text-2);font-size:13px}
    .chart-inline-result b{font-size:15px;color:var(--text)}
    .chart-inline-result .bad-text{color:var(--red)}
    .chart-inline-result .ok-text{color:var(--brand-dark)}
    .clickable-row{cursor:pointer}
    .clickable-row.selected td{background:#F1FAF6!important}
    .object-seg{display:flex;border:1px solid #D7DEE7;border-radius:7px;overflow:hidden;height:38px;background:#fff}
    .object-seg button{height:36px;padding:0 17px;border:0;border-right:1px solid #D7DEE7;background:#fff;color:var(--text-2)}
    .object-seg button:last-child{border-right:0}
    .object-seg button.active{background:var(--brand);color:#fff}
    .flow-tabs{display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--border);margin:-2px -2px 10px;padding:0 2px}
    .flow-tab{height:43px;border:0;background:transparent;color:var(--text-2);position:relative;padding:0 2px;font-weight:600}
    .flow-tab.active{color:var(--brand-dark)}
    .flow-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--brand)}
    .flow-head-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
    .flow-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--text-2);font-size:12px}
    .legend-square{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}
    .flow-main{position:relative}
    .node-tooltip{position:absolute;z-index:5;min-width:180px;max-width:260px;background:#172033;color:#fff;border-radius:7px;padding:10px 12px;font-size:12px;line-height:1.7;box-shadow:0 10px 24px rgba(16,24,40,.24);display:none;pointer-events:none}
    .node-tooltip.show{display:block}
    .difference-strip{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;background:#FFFDFC;border:1px solid #F2E3D0;border-radius:9px;color:var(--text-2);font-size:13px}
    .difference-strip strong{color:var(--text)}
    .difference-strip .warning-value{color:var(--orange);font-weight:700}
    .difference-strip .loss-value{color:var(--red);font-weight:700}
    .difference-strip .muted-value{color:var(--muted);font-weight:600}
    .balance-card{padding:10px 14px 14px}
    .balance-card table{min-width:980px}
    .formula-box{padding:14px;border:1px solid #DCE5EC;border-radius:8px;background:#F8FAFC;color:#334155;line-height:1.8}
    .formula-box strong{color:var(--text)}
    .modal-note{margin-top:14px;padding:12px 14px;border-radius:8px;background:#F5F8FB;color:var(--text-2);font-size:13px;line-height:1.7}
    .detail-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .detail-list .detail-box{min-height:70px}
    .mini-table{width:100%;border-collapse:collapse;min-width:0}

  function exportQueryCsv(rows,data,titleUnit,monthMode){
    const headers=['统计期间','用能单元','能源类别','能源品种','实物量','单位','折标量(tce)','占比','同比'];
    if(monthMode) headers.push('环比');
    const period=monthMode?'2026年6月':'2026年度';
    const lines=[headers];
    rows.forEach(r=>{
      const line=[period,r.unit,r.category,r.energy,r.physical,r.measure,r.tce,`${r.share}%`,`${r.yoy}%`];
      if(monthMode) line.push(`${r.mom}%`);
      lines.push(line);
    });
    const csv='\uFEFF'+lines.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`能源消费明细_${titleUnit}_${period}.csv`;a.click();URL.revokeObjectURL(a.href);toast('能源消费明细已导出');
  }

  }

  function benchmarkFilteredRows(){
    if(state.benchmark.type==='all') return benchmarkRows;
    return benchmarkRows.filter(r=>r.typeKey===state.benchmark.type);
  }
  function benchmarkObjects(){return [...new Set(benchmarkFilteredRows().map(r=>r.object))];}
  function benchmarkMetrics(object){return benchmarkFilteredRows().filter(r=>r.object===object);}
  function selectedBenchmark(){return benchmarkRows.find(r=>r.id===state.benchmark.selectedId) || benchmarkRows[0];}
  function isBenchmarkGood(r){return r.direction==='high'?r.actual>=r.target:r.actual<=r.target;}

  function renderBenchmark(){
    const s=state.benchmark;
    const rows=benchmarkFilteredRows();
    const selected=selectedBenchmark();
    const objects=benchmarkObjects();

    const good=isBenchmarkGood(selected);
    const diffRate=(selected.actual-selected.target)/selected.target*100;

  function benchmarkLineSvg(row,grain){
    let values=row.trend.slice();let labels=values.map((_,i)=>`${i+1}月`);
    if(grain==='quarter'){
      values=[0,1,2,3].map(q=>values.slice(q*3,q*3+3).reduce((a,b)=>a+b,0)/3);labels=['一季度','二季度','三季度','四季度'];
    }else if(grain==='year'){
      values=[row.actual];labels=['2026年'];
    }
    const target=row.target,w=1120,h=300,pad={l:55,r:36,t:28,b:46};
    const min=Math.min(...values,target),max=Math.max(...values,target),span=(max-min)||1,low=min-span*.35,high=max+span*.25;
    const x=i=>values.length===1?w/2:pad.l+i*(w-pad.l-pad.r)/(values.length-1);const y=v=>pad.t+(high-v)*(h-pad.t-pad.b)/(high-low);
    const points=values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    const grid=[0,.25,.5,.75,1].map(t=>{const yy=pad.t+t*(h-pad.t-pad.b);const val=high-t*(high-low);return `<line x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}" stroke="#E5EAF0" stroke-dasharray="4 4"/><text x="4" y="${yy+4}" font-size="11" fill="#8A94A3">${fmt(val,row.unit==='%'?1:row.actual<1?3:1)}</text>`}).join('');
    return `<svg viewBox="0 0 ${w} ${h}" aria-label="指标趋势图">${grid}<line x1="${pad.l}" y1="${y(target)}" x2="${w-pad.r}" y2="${y(target)}" stroke="#00A870" stroke-width="2" stroke-dasharray="7 5"/><text x="${w-pad.r-4}" y="${y(target)-7}" text-anchor="end" font-size="11" fill="#00875A">目标值 ${fmt(target,target<1?3:target<10?2:1)}</text>${values.length>1?`<polyline points="${points}" fill="none" stroke="#1677FF" stroke-width="3"/>`:''}${values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#fff" stroke="#1677FF" stroke-width="2"/><text x="${x(i)}" y="${y(v)-11}" text-anchor="middle" font-size="11" fill="#365A7A">${fmt(v,v<1?3:v<10?2:v>10000?0:1)}</text><text x="${x(i)}" y="${h-15}" text-anchor="middle" font-size="11" fill="#667085">${labels[i]}</text>`).join('')}</svg>`;
  }

        {id:'paCore',name:'核心工序',value:'2,959 tce',x:650,y:162,color:'#23A35A',tip:'二级用能单元'},
        {id:'paPack',name:'包装发运',value:'621 tce',x:650,y:262,color:'#23A35A',tip:'二级用能单元'}
      ]:[{id:'paUnit',name:'生产单元A',value:'5,060 tce',x:650,y:162,color:'#23A35A',tip:'当前组织范围已分配能源量'}]),
      {id:'paUnallocated',name:'未分配能源量',value:'100 tce',x:945,y:202,color:'#98A2B3',tip:'生产单元A与下级工序合计的差额'}
    ];
    const paths=[];const add=(a,b,d,c,w)=>paths.push({a,b,d,c,w});
    if(level==='level2'){
      add('paElectric','paRaw','M155 88 C360 75 500 90 650 90','#1677FF',13);add('paElectric','paCore','M155 92 C360 120 500 185 650 190','#1677FF',18);add('paGas','paCore','M155 168 C380 168 520 190 650 190','#23A35A',17);add('paSteam','paPack','M155 248 C380 250 520 288 650 290','#F79009',9);add('paOther','paPack','M155 328 C390 325 520 292 650 290','#7A5AF8',6);add('paOther','paUnallocated','M155 330 C600 350 800 230 945 230','#98A2B3',4);
    }else{
      add('paElectric','paUnit','M155 88 C380 100 520 185 650 190','#1677FF',25);add('paGas','paUnit','M155 168 C380 168 520 190 650 190','#23A35A',17);add('paSteam','paUnit','M155 248 C390 230 520 195 650 190','#F79009',9);add('paOther','paUnit','M155 328 C400 280 520 205 650 195','#7A5AF8',6);add('paOther','paUnallocated','M155 330 C600 350 800 230 945 230','#98A2B3',4);
    }
    return `<svg class="sankey" viewBox="0 0 1095 390" aria-label="生产单元A能源流向图"><text x="35" y="27" font-size="14" font-weight="700">能源输入（tce）</text><text x="340" y="27" font-size="14" font-weight="700">转换或自产（可选）</text><text x="650" y="27" font-size="14" font-weight="700">${level==='level2'?'二级用能单元':'当前组织范围'}（tce）</text><text x="945" y="27" font-size="14" font-weight="700">差额</text>${paths.map(p=>`<path class="flow" data-keys="${p.a} ${p.b}" d="${p.d}" stroke="${p.c}" stroke-width="${p.w}"/>`).join('')}${nodes.map(n=>`<g class="node" data-key="${n.id}" data-name="${n.name}" data-value="${n.value}" data-tip="${n.tip}"><rect x="${n.x}" y="${n.y}" width="120" height="55" rx="7" fill="#fff" stroke="${n.color}"/><rect x="${n.x}" y="${n.y}" width="7" height="55" rx="3" fill="${n.color}"/><text x="${n.x+18}" y="${n.y+22}" font-size="13" fill="#172033">${n.name}</text><text x="${n.x+18}" y="${n.y+42}" font-size="11" fill="#5F6B7A">${n.value}</text></g>`).join('')}</svg>`;
  }

  function bindSankeyInteractions(){
    const wrap=document.getElementById('sankeyWrap');const tooltip=document.getElementById('nodeTooltip');
    if(!wrap || !tooltip) return;
    document.querySelectorAll('.sankey .node').forEach(node=>node.onclick=e=>{
      const key=node.dataset.key;
      document.querySelectorAll('.sankey .node').forEach(x=>x.classList.toggle('selected',x===node));
      document.querySelectorAll('.sankey .flow').forEach(p=>p.classList.toggle('active',p.dataset.keys.split(' ').includes(key)));
      const rect=wrap.getBoundingClientRect();
      tooltip.innerHTML=`<strong>${node.dataset.name}</strong><br>${node.dataset.value}<br>${node.dataset.tip}`;
      tooltip.style.left=`${Math.min(e.clientX-rect.left+12,rect.width-270)}px`;
      tooltip.style.top=`${Math.max(e.clientY-rect.top-10,45)}px`;
      tooltip.classList.add('show');
    });
    wrap.addEventListener('mouseleave',()=>tooltip.classList.remove('show'));
  }

  function openLossDetail(data){
    openModal('差异与损失说明',`<div class="detail-list"><div class="detail-box"><span>未分配能源量</span>${fmt(data.unallocated)} tce</div><div class="detail-box"><span>性质</span>能源归属差异</div><div class="detail-box"><span>可计算转换损失</span>${data.loss===null?'暂无可计算数据':fmt(data.loss)+' tce'}</div><div class="detail-box"><span>性质</span>转换投入与产出的折标差额</div><div class="detail-box"><span>输配损失</span>暂无计量数据</div><div class="detail-box"><span>计算条件</span>需来源端与去向端双侧计量</div></div><div class="modal-note">未分配能源量不等同于能源损失，三类数据不合并为“总损失”。只有具备转换投入和产出数据时，系统才计算转换效率与转换损失。</div>`,{showConfirm:false});
  }

  function openFlowDetail(r){
    if(r.action==='source'){
      openModal('能源流向来源',`<div class="detail-list"><div class="detail-box"><span>流向类型</span>${r.type}</div><div class="detail-box"><span>终端去向</span>${r.target}</div><div class="detail-box"><span>输入能源</span>${r.input}</div><div class="detail-box"><span>折标量</span>${fmt(r.tce)} tce</div></div><div class="modal-note"><strong>引用数据：</strong>${r.source}</div>`,{showConfirm:false});
    }else{
      const extra=r.efficiency?`<div class="detail-box"><span>转换投入</span>${fmt(r.inputTce)} tce</div><div class="detail-box"><span>转换产出</span>${fmt(r.outputTce)} tce</div><div class="detail-box"><span>转换效率</span>${fmt(r.efficiency,1)}%</div><div class="detail-box"><span>转换损失</span>${fmt(r.loss)} tce</div>`:'';
      openModal(r.type==='外部输出'?'外部输出关系':'能源转换关系',`<div class="detail-list"><div class="detail-box"><span>输入能源</span>${r.input}</div><div class="detail-box"><span>关系/转换</span>${r.relation}</div><div class="detail-box"><span>终端去向</span>${r.target}</div><div class="detail-box"><span>折标量</span>${fmt(r.tce)} tce</div>${extra}</div><div class="modal-note"><strong>引用数据：</strong>${r.source}</div>`,{showConfirm:false});
    }
  }

  document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>{state.page=btn.dataset.page;render();}));
  document.querySelectorAll('.side-group-title').forEach(btn=>btn.addEventListener('click',()=>btn.parentElement.classList.toggle('open')));
  document.getElementById('collapseBtn').onclick=()=>document.body.classList.toggle('compact');
  render();
})();
</script>
</body>
</html>
