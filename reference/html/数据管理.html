<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通用能碳平台｜能源数据管理 V9</title>
  <style>
    :root{
      --gcl-green:#00A870;
      --gcl-green-dark:#00875A;
      --gcl-green-light:#EAF8F3;
      --gcl-green-soft:#F3FAF7;
      --tech-blue:#1677FF;
      --nav-bg:#142133;
      --nav-hover:#203149;
      --page-bg:#F4F6F8;
      --card-bg:#FFFFFF;
      --text:#172033;
      --text-secondary:#5F6B7A;
      --text-muted:#8A94A3;
      --border:#E4E9EF;
      --table-head:#F7F9FB;
      --tree-parent:#FAFCFB;
      --danger:#F04438;
      --warning:#F79009;
      --shadow:0 8px 28px rgba(16,24,40,.14);
      --radius:8px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;min-height:100%;
      font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
      color:var(--text);background:var(--page-bg)
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{display:flex;min-height:100vh}
    .sidebar{
      width:224px;background:var(--nav-bg);color:#fff;
      display:flex;flex-direction:column;
      position:fixed;left:0;top:0;bottom:0;z-index:20;
    }
    .brand{
      height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;
      border-bottom:1px solid rgba(255,255,255,.08);
      font-size:16px;font-weight:600;
    }
    .brand-logo{
      width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
      background:linear-gradient(135deg,#00B578 0%,#1677FF 100%);
      font-size:12px;font-weight:700;
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);
    }
    .menu-section{padding:16px 12px 6px;font-size:12px;color:#8190A5}
    .menu-item{
      height:44px;margin:3px 8px;padding:0 14px;border:0;border-radius:6px;
      background:transparent;color:#B7C2D1;display:flex;align-items:center;gap:10px;
      width:calc(100% - 16px);text-align:left;transition:.15s;
    }
    .menu-item:hover{background:var(--nav-hover);color:#fff}
    .menu-item.active{background:rgba(0,168,112,.16);color:#fff;position:relative}
    .menu-item.active::before{
      content:"";position:absolute;left:-8px;width:3px;height:24px;border-radius:2px;background:var(--gcl-green)
    }
    .menu-icon{width:18px;text-align:center;font-size:15px}
    .sidebar-footer{
      margin-top:auto;border-top:1px solid rgba(255,255,255,.08);
      padding:10px 12px 16px
    }
    .main{margin-left:224px;width:calc(100% - 224px);min-width:0}
    .topbar{
      height:64px;background:#fff;border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;padding:0 24px;
      position:sticky;top:0;z-index:10;
    }
    .breadcrumb{font-size:14px;color:var(--text-muted)}
    .breadcrumb strong{color:var(--text-secondary);font-weight:500}
    .user{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-secondary)}
    .avatar{
      width:30px;height:30px;border-radius:50%;background:#E8ECF1;
      display:grid;place-items:center;color:#7A8594
    }
    .content{padding:24px}
    .page-head{margin-bottom:18px}
    .page-title{margin:0;font-size:22px;font-weight:600}
    .page-desc{margin-top:7px;font-size:14px;color:var(--text-muted)}
    .card{
      background:var(--card-bg);border:1px solid var(--border);
      border-radius:var(--radius);box-shadow:0 1px 2px rgba(28,45,72,.03)
    }
    .toolbar{
      min-height:74px;padding:16px;display:flex;align-items:flex-end;
      gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)
    }
    .field{min-width:155px}
    .field.search{min-width:240px}
    label{display:block;margin-bottom:6px;font-size:13px;color:var(--text-secondary)}
    input,select,textarea{
      width:100%;height:38px;border:1px solid #D8DEE7;border-radius:6px;
      background:#fff;padding:0 11px;color:var(--text);outline:none;transition:.15s
    }
    textarea{height:86px;padding-top:9px;resize:vertical}
    input:focus,select:focus,textarea:focus{
      border-color:var(--gcl-green);
      box-shadow:0 0 0 2px rgba(0,168,112,.10)
    }
    input[readonly]{
      background:#F7F9FB;color:var(--text-secondary);cursor:not-allowed
    }
    .spacer{flex:1}
    .btn{
      height:38px;border-radius:6px;padding:0 15px;border:1px solid var(--border);
      background:#fff;display:inline-flex;align-items:center;justify-content:center;
      gap:6px;color:var(--text-secondary);transition:.15s;white-space:nowrap
    }
    .btn:hover{border-color:var(--gcl-green);color:var(--gcl-green)}
    .btn-primary{background:var(--gcl-green);border-color:var(--gcl-green);color:#fff}
    .btn-primary:hover{
      background:var(--gcl-green-dark);border-color:var(--gcl-green-dark);color:#fff
    }
    .btn-link{
      height:auto;padding:2px 4px;border:0;background:transparent;color:var(--tech-blue)
    }
    .btn-link.danger{color:var(--danger)}
    .notice{
      margin:14px 16px;padding:10px 12px;background:var(--gcl-green-soft);
      border:1px solid #D5EFE5;border-radius:6px;color:#467565;font-size:13px
    }
    .notice strong{font-weight:600;color:var(--gcl-green-dark)}
    .context-strip{
      grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
      padding:11px 13px;border:1px solid #D5EFE5;border-radius:6px;
      background:var(--gcl-green-soft);color:var(--text-secondary);font-size:13px
    }
    .context-strip strong{color:var(--gcl-green-dark);font-weight:600}
    .context-divider{width:1px;height:16px;background:#D6E7E0}
    .tabs{
      height:50px;padding:0 16px;display:flex;gap:28px;
      border-bottom:1px solid var(--border)
    }
    .tab{
      border:0;background:transparent;color:var(--text-secondary);
      position:relative;padding:0 2px;font-size:14px
    }
    .tab.active{color:var(--gcl-green);font-weight:600}
    .tab.active::after{
      content:"";height:2px;background:var(--gcl-green);
      position:absolute;left:0;right:0;bottom:0
    }
    .level-tabs{
      display:flex;gap:6px;padding:12px 16px 0;background:#fff;
      border-bottom:1px solid var(--border);overflow-x:auto
    }
    .level-tab{
      height:36px;padding:0 14px;border:1px solid transparent;border-radius:6px 6px 0 0;
      background:transparent;color:var(--text-secondary);white-space:nowrap
    }
    .level-tab:hover{color:var(--gcl-green)}
    .level-tab.active{
      color:var(--gcl-green-dark);font-weight:600;background:var(--gcl-green-soft);
      border-color:#D5EFE5;border-bottom-color:var(--gcl-green-soft)
    }
    .table-wrap{width:100%;overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:920px}
    th,td{
      height:52px;padding:0 14px;border-bottom:1px solid #EDF0F4;
      text-align:left;font-size:14px;white-space:nowrap
    }
    th{
      height:44px;background:var(--table-head);
      font-size:13px;color:var(--text-secondary);font-weight:500
    }
    tbody tr:hover td{background:#FBFDFC}
    tbody tr.parent-row td{background:var(--tree-parent)}
    tbody tr.parent-row:hover td{background:#F5FAF8}
    .unit-cell{display:flex;align-items:center;gap:8px}
    .tree-toggle{
      width:22px;height:22px;border:1px solid #DDE5E1;border-radius:4px;
      display:grid;place-items:center;background:#fff;color:var(--gcl-green-dark);
      padding:0;font-size:12px;flex:none
    }
    .parent-name{font-weight:600}
    .child-name{padding-left:30px;position:relative}
    .child-name::before{
      content:"";position:absolute;left:9px;top:50%;width:13px;height:16px;
      border-left:1px solid #C9D4CF;border-bottom:1px solid #C9D4CF;
      transform:translateY(-10px)
    }
    .child-count{
      display:inline-flex;height:22px;padding:0 7px;align-items:center;
      border-radius:11px;background:var(--gcl-green-light);
      color:var(--gcl-green-dark);font-size:12px;font-weight:400
    }
    .tag{
      display:inline-flex;align-items:center;height:24px;padding:0 8px;
      border-radius:4px;font-size:12px;background:var(--gcl-green-light);
      color:var(--gcl-green-dark);border:1px solid #BFE9D9
    }
    .tag.blue{background:#EEF5FF;color:#1769C2;border-color:#CFE3FF}
    .tag.gray{background:#F1F3F5;color:#667085;border-color:#E3E7EC}
    .tag.orange{background:#FFF7E8;color:#B54708;border-color:#FDE1B4}
    .pagination{
      height:56px;padding:0 16px;display:flex;justify-content:flex-end;
      align-items:center;gap:10px;color:var(--text-muted);font-size:13px
    }
    .page-dot{
      width:30px;height:30px;border:1px solid var(--gcl-green);
      color:var(--gcl-green);border-radius:5px;display:grid;place-items:center
    }
    .empty{
      height:130px;text-align:center;color:var(--text-muted)
    }
    .overlay{
      position:fixed;inset:0;background:rgba(16,24,40,.48);z-index:100;
      display:none;align-items:center;justify-content:center;padding:20px
    }
    .overlay.open{display:flex}
    .modal{
      width:min(760px,96vw);max-height:90vh;overflow:auto;
      background:#fff;border-radius:10px;box-shadow:var(--shadow)
    }
    .modal.small{width:min(620px,96vw)}
    .modal-head{
      height:60px;padding:0 22px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between
    }
    .modal-title{font-size:17px;font-weight:600}
    .modal-close{border:0;background:transparent;font-size:23px;color:#8993A2}
    .modal-body{padding:22px}
    .form-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 18px
    }
    .full{grid-column:1/-1}
    .required::before{content:"*";color:var(--danger);margin-right:4px}
    .help{font-size:12px;color:var(--text-muted);margin-top:5px}
    .month-grid{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
      gap:15px 14px;margin-top:20px
    }
    .modal-foot{
      height:64px;padding:0 22px;border-top:1px solid var(--border);
      display:flex;justify-content:flex-end;align-items:center;gap:10px
    }
    .custom-row{display:none}
    .custom-row.show{display:block}
    .choice-row{
      display:flex;gap:10px;flex-wrap:wrap;margin-top:2px
    }
    .choice{
      border:1px solid #D8DEE7;background:#fff;border-radius:6px;
      padding:8px 12px;color:var(--text-secondary)
    }
    .choice.active{
      border-color:var(--gcl-green);background:var(--gcl-green-soft);
      color:var(--gcl-green-dark)
    }
    .form-section-title{
      margin-top:18px;padding-bottom:9px;border-bottom:1px solid var(--border);
      font-size:14px;font-weight:600
    }
    .auto-info{
      grid-column:1/-1;display:flex;gap:22px;align-items:center;flex-wrap:wrap;
      padding:10px 12px;background:#F7F9FB;border:1px solid var(--border);
      border-radius:6px;color:var(--text-secondary);font-size:13px
    }
    .auto-info strong{color:var(--text);font-weight:600}
    .detail-row td{background:#FAFCFB!important;padding:14px 18px}
    .detail-panel{
      border:1px solid #DCE9E3;border-radius:7px;background:#fff;padding:14px
    }
    .detail-head{
      display:flex;justify-content:space-between;gap:12px;align-items:center;
      margin-bottom:12px;color:var(--text-secondary);font-size:13px
    }
    .detail-grid{
      display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px
    }
    .detail-item{
      padding:9px 10px;border:1px solid #EDF0F4;border-radius:6px;background:#FBFCFD
    }
    .detail-label{font-size:12px;color:var(--text-muted)}
    .detail-value{margin-top:3px;font-size:14px;color:var(--text)}
    .summary-line{
      display:flex;justify-content:flex-end;gap:8px;align-items:center;
      margin-top:12px;color:var(--text-secondary);font-size:13px
    }
    .summary-line strong{color:var(--gcl-green-dark);font-size:16px}
    @media(max-width:900px){
      .detail-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    .toast{
      position:fixed;right:24px;top:82px;z-index:200;background:#fff;
      border:1px solid #CDEBDD;box-shadow:var(--shadow);border-radius:8px;
      padding:12px 16px;display:none;align-items:center;gap:8px;
      color:var(--gcl-green-dark);font-size:14px
    }
    .toast.show{display:flex}
    @media(max-width:900px){
      .sidebar{width:72px}
      .brand span,.menu-section,.menu-item span:last-child,.sidebar-footer{display:none}
      .brand{justify-content:center;padding:0}
      .menu-item{justify-content:center;padding:0;margin-left:8px}
      .main{margin-left:72px;width:calc(100% - 72px)}
      .form-grid,.month-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .full{grid-column:1/-1}
    }
  </style>
</head>
<body>
<div class="app">

</div>

  </div>
</div>

<div class="toast" id="toast" aria-live="polite">
  <span>✓</span><span id="toastText">保存成功</span>
</div>

  function escapeHtml(text){
    return String(text ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");
  }

  function fmt(value, digits=0){
    return Number(value || 0).toLocaleString('zh-CN',{
      minimumFractionDigits:digits,
      maximumFractionDigits:digits
    });
  }

  function sum(values){
    return (values || []).reduce((total,value)=>total+Number(value || 0),0);
  }

  function toast(text){
    $('#toastText').textContent = text;
    $('#toast').classList.add('show');
    setTimeout(()=>$('#toast').classList.remove('show'),1800);
  }

  function allUnits(){
    const list = [{name:'全厂',level:'企业'}];
    state.units.forEach(parent=>{
      list.push({name:parent.name,level:'一级用能单元'});
      parent.children.forEach(child=>{
        list.push({name:child.name,level:'二级用能单元'});
      });
    });
    return list;
  }

  function unitOptions(selected='', includeFactory=true){

      .map(item=>`<option ${item.name===selected?'selected':''}>${escapeHtml(item.name)}</option>`)
      .join('');
  }

  function groupedUnitOptions(selected=''){

      state.units.map(item=>`<option ${selected===item.name?'selected':''}>${escapeHtml(item.name)}</option>`).join('')

      state.units.flatMap(item=>item.children)
        .map(item=>`<option ${selected===item.name?'selected':''}>${escapeHtml(item.name)}</option>`).join('')
    }</optgroup>`;
    return enterprise + roots + children;
  }

    if(level==='level2') return state.units.flatMap(parent=>parent.children.map(item=>({name:item.name,level:'二级用能单元',parentName:parent.name})));
    return allUnits();
  }

    if(state.page==='units') renderUnits();
    if(state.page==='energy') renderEnergy();
    if(state.page==='records') renderRecords();
    if(state.page==='operations') renderOperations();
    if(state.page==='devices') renderDevices();
  }

  function renderUnits(){
    const filter = state.filters.units;
    const rows = [];

    state.units.forEach(parent=>{
      const parentMatches =
        (!filter.keyword || parent.name.includes(filter.keyword)) &&
        (!filter.type || parent.type===filter.type);

      const matchedChildren = parent.children.filter(child=>
        (!filter.keyword || child.name.includes(filter.keyword)) &&
        (!filter.type || child.type===filter.type)
      );

      if(!parentMatches && matchedChildren.length===0) return;

      const expanded = state.expanded.has(parent.id) || filter.keyword || filter.type;

      rows.push(`
        <tr class="parent-row">
          <td>
            <div class="unit-cell">
              <button class="tree-toggle" type="button" data-toggle="${parent.id}">
                ${expanded?'−':'+'}
              </button>
              <span class="parent-name">${escapeHtml(parent.name)}</span>
              <span class="child-count">${parent.children.length}个下级</span>
            </div>
          </td>
          <td><span class="tag">一级</span></td>
          <td>${escapeHtml(parent.type)}</td>
          <td>
            <button class="btn-link add-child" data-parent="${parent.id}" type="button">添加下级</button>
            <button class="btn-link edit-unit" data-id="${parent.id}" data-level="1" type="button">编辑</button>
            <button class="btn-link danger delete-unit" data-id="${parent.id}" data-level="1" type="button">删除</button>
          </td>
        </tr>
      `);

      if(expanded){
        const children = (filter.keyword || filter.type) ? matchedChildren : parent.children;
        children.forEach(child=>{
          rows.push(`
            <tr>
              <td><div class="unit-cell child-name">${escapeHtml(child.name)}</div></td>
              <td><span class="tag blue">二级</span></td>
              <td>${escapeHtml(child.type)}</td>
              <td>
                <button class="btn-link edit-unit" data-id="${child.id}" data-level="2" data-parent="${parent.id}" type="button">编辑</button>
                <button class="btn-link danger delete-unit" data-id="${child.id}" data-level="2" data-parent="${parent.id}" type="button">删除</button>
              </td>
            </tr>
          `);
        });
      }
    });

    const total = state.units.reduce((n,parent)=>n+1+parent.children.length,0);

    screen.innerHTML = `
      ${toolbar(`
        <div class="field search">
          <label for="unitKeyword">关键字</label>
          <input id="unitKeyword" value="${escapeHtml(filter.keyword)}" placeholder="搜索用能单元名称">
        </div>
        <div class="field">
          <label for="unitTypeFilter">单元类型</label>
          <select id="unitTypeFilter">
            ${selectOptions(unitTypes,filter.type,true)}
          </select>
        </div>
      `,'新增一级用能单元')}
      <div class="notice">
        一期采用两级结构：一级用能单元可表示车间、产线、楼栋等；二级用能单元可表示工序、系统或功能区域。
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th style="width:38%">用能单元</th><th>层级</th><th>单元类型</th><th>操作</th></tr>
          </thead>
          <tbody>${rows.length?rows.join(''):tableEmpty(4)}</tbody>
        </table>
      </div>
      ${pagination(total)}
    `;

    $('#addBtn').addEventListener('click',openAddRootUnit);
    $('#unitKeyword').addEventListener('input',event=>{
      state.filters.units.keyword = event.target.value;
      renderUnits();
    });
    $('#unitTypeFilter').addEventListener('change',event=>{
      state.filters.units.type = event.target.value;
      renderUnits();
    });

    document.querySelectorAll('[data-toggle]').forEach(button=>{
      button.addEventListener('click',()=>{
        const id = Number(button.dataset.toggle);
        state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
        renderUnits();
      });
    });

    document.querySelectorAll('.add-child').forEach(button=>{
      button.addEventListener('click',()=>openAddChildUnit(Number(button.dataset.parent)));
    });

    document.querySelectorAll('.edit-unit').forEach(button=>{
      button.addEventListener('click',()=>{
        openEditUnit(
          Number(button.dataset.id),
          Number(button.dataset.level),
          button.dataset.parent ? Number(button.dataset.parent) : null
        );
      });
    });

    document.querySelectorAll('.delete-unit').forEach(button=>{
      button.addEventListener('click',()=>{
        deleteUnit(
          Number(button.dataset.id),
          Number(button.dataset.level),
          button.dataset.parent ? Number(button.dataset.parent) : null
        );
      });
    });
  }

  function unitForm(data={}, level=1, parent=null, editing=false){
    const options = level===1
      ? ['生产单元','公辅系统','建筑/区域','其他']
      : ['工序/环节','公辅系统','建筑/区域','其他'];

    const context = level===2 ? `
      <div class="context-strip">
        <span>所属一级单元：<strong>${escapeHtml(parent.name)}</strong></span>
        <span class="context-divider"></span>
        <span>${editing?'当前层级':'新增层级'}：<strong>二级用能单元</strong></span>
      </div>
    ` : '';

    return `
      <div class="form-grid">
        ${context}
        <div>
          <label class="required" for="unitType">单元类型</label>
          <select id="unitType">${selectOptions(options,data.type||options[0])}</select>
        </div>
        <div>
          <label class="required" for="unitName">用能单元名称</label>
          <input id="unitName" value="${escapeHtml(data.name||'')}" placeholder="">
        </div>
        <div class="full">
          <label for="unitRemark">备注</label>
          <textarea id="unitRemark" placeholder="选填">${escapeHtml(data.remark||'')}</textarea>
        </div>
      </div>
    `;
  }

  function bindUnitNameHint(level){
    const type = $('#unitType');
    const name = $('#unitName');
    if(!type || !name) return;

    const placeholders = {
      '生产单元':'如：1号熟料生产线、生产车间一',
      '工序/环节':'如：熟料烧成、包装发运',
      '公辅系统':'如：空压系统、供配电系统',
      '建筑/区域':'如：办公楼、仓储区域',
      '其他':'请输入具体用能单元名称'
    };

    const update = ()=>{
      name.placeholder = placeholders[type.value] || '请输入用能单元名称';
    };
    type.addEventListener('change',update);
    update();
  }

  function openAddRootUnit(){
    openModal('新增一级用能单元',unitForm({},1,null,false),()=>{
      const name = $('#unitName').value.trim();
      if(!name) return alert('请填写用能单元名称。');
      if(unitNameExists(name)) return alert('用能单元名称已存在。');

      state.units.push({
        id:nextId++,name,level:1,type:$('#unitType').value,
        remark:$('#unitRemark').value.trim(),
        referenced:false,children:[]
      });
      closeModal();renderUnits();toast('保存成功');
    },true);
    bindUnitNameHint(1);
  }

  function openAddChildUnit(parentId){
    const parent = state.units.find(item=>item.id===parentId);
    if(!parent) return;

    openModal('添加下级用能单元',unitForm({},2,parent,false),()=>{
      const name = $('#unitName').value.trim();
      if(!name) return alert('请填写用能单元名称。');
      if(unitNameExists(name)) return alert('用能单元名称已存在。');

      parent.children.push({
        id:nextId++,name,level:2,type:$('#unitType').value,
        remark:$('#unitRemark').value.trim(),
        referenced:false
      });
      state.expanded.add(parent.id);
      closeModal();renderUnits();toast('保存成功');
    },true);
    bindUnitNameHint(2);
  }

  function openEditUnit(id,level,parentId){
    if(level===1){
      const item = state.units.find(unit=>unit.id===id);
      if(!item) return;

      openModal('编辑一级用能单元',unitForm(item,1,null,true),()=>{
        const name = $('#unitName').value.trim();
        if(!name) return alert('请填写用能单元名称。');
        if(unitNameExists(name,id)) return alert('用能单元名称已存在。');

        Object.assign(item,{
          name,type:$('#unitType').value,
          remark:$('#unitRemark').value.trim()
        });
        closeModal();renderUnits();toast('保存成功');
      },true);
      bindUnitNameHint(1);
    }else{
      const parent = state.units.find(unit=>unit.id===parentId);
      const item = parent?.children.find(child=>child.id===id);
      if(!parent || !item) return;

      openModal('编辑下级用能单元',unitForm(item,2,parent,true),()=>{
        const name = $('#unitName').value.trim();
        if(!name) return alert('请填写用能单元名称。');
        if(unitNameExists(name,id)) return alert('用能单元名称已存在。');

        Object.assign(item,{
          name,type:$('#unitType').value,
          remark:$('#unitRemark').value.trim()
        });
        closeModal();renderUnits();toast('保存成功');
      },true);
      bindUnitNameHint(2);
    }
  }

  function unitNameExists(name,excludeId=null){
    return state.units.some(parent=>{
      if(parent.id!==excludeId && parent.name===name) return true;
      return parent.children.some(child=>child.id!==excludeId && child.name===name);
    });
  }

  function deleteUnit(id,level,parentId){
    let item;
    if(level===1) item = state.units.find(unit=>unit.id===id);
    else item = state.units.find(unit=>unit.id===parentId)?.children.find(child=>child.id===id);
    if(!item) return;

    if(level===1 && item.children.length){
      return alert('该一级用能单元仍包含下级单元，请先删除下级单元。');
    }
    if(item.referenced){
      return alert('该用能单元已关联能源、运营或设备数据，暂不能删除。');
    }
    if(!confirm(`确认删除“${item.name}”吗？`)) return;

    if(level===1){
      state.units = state.units.filter(unit=>unit.id!==id);
    }else{
      const parent = state.units.find(unit=>unit.id===parentId);
      parent.children = parent.children.filter(child=>child.id!==id);
    }
    renderUnits();toast('删除成功');
  }

  function openConsumptionModal(index,preferredLevel='all'){
    const current = index===null ? null : state.consumption[index];
    const effectiveLevel = current ? (current.level==='企业'?'enterprise':current.level==='一级用能单元'?'level1':'level2') : preferredLevel;
    const candidateUnits = unitsByLevel(effectiveLevel);
    const initialScope = current?.unitName || candidateUnits[0]?.name || '全厂';

          <label class="required" for="dataScope">归属范围</label>
          <select id="dataScope">${effectiveLevel==='all'?groupedUnitOptions(initialScope):unitOptionsByLevel(effectiveLevel,initialScope)}</select>

          <label class="required" for="dataEnergy">能源品种</label>

          <span>分析类别：<strong id="autoCategory">—</strong></span>

        </div>

        <div id="annualRecordWrap" class="full ${initialMethod==='年度填报'?'':'custom-row'}">
          <label class="required" for="annualRecordValue">年度能源量</label>
          <input id="annualRecordValue" type="number" min="0" step="0.01"
            value="${current?.annual ?? ''}" placeholder="请输入年度值">
        </div>
      </div>

      <div id="monthlyRecordWrap" class="${initialMethod==='月度填报'?'':'custom-row'}">
        <div class="form-section-title">月度数据</div>
        ${optionalMonthInputs(current?.m)}
        <div class="summary-line">当前合计：<strong id="recordLiveTotal">0</strong> <span id="recordTotalUnit"></span></div>
      </div>
    `,()=>{
      const energy = state.energy.find(item=>item.name===$('#dataEnergy').value);
      if(!energy) return alert('请选择能源品种。');

      const scope = $('#dataScope').value;
      const scopeItem = allUnits().find(item=>item.name===scope);
      const method = $('#recordMethodValue').value;
      let months = [];
      let annual = 0;

      if(method==='月度填报'){
        months = readOptionalMonths();
        if(!months.some(value=>value!==null)) return alert('请至少填写一个月份的数据。');
      }else{
        const annualRaw = $('#annualRecordValue').value.trim();
        if(annualRaw==='') return alert('请填写年度能源量。');
        annual = Number(annualRaw);
      }

      const duplicate = state.consumption.some((item,i)=>
        i!==index && item.dataType==='能源消费' && String(item.year)===String(state.filters.consumption.year) &&
        item.unitName===scope && item.energy===energy.name
      );
      if(duplicate) return alert('同一归属范围和能源品种已存在，请直接编辑原记录。');

      const item = {
        id:current?.id || nextId++,year:Number(state.filters.consumption.year),
        level:scopeItem?.level || '企业',unitName:scope,
        dataType:'能源消费',
        category:energy.category,energy:energy.name,unit:energy.unit,
        method,annual,m:months

      if(index===null) state.consumption.push(item);
      else state.consumption[index] = item;
      closeModal();renderRecords();toast('能源消费已保存');
    });

    const updateAutoInfo = ()=>{
      const energy = state.energy.find(item=>item.name===$('#dataEnergy').value);
      const scope = allUnits().find(item=>item.name===$('#dataScope').value);
      $('#autoCategory').textContent = energy?.category || '—';

      if(input) input.addEventListener('input',updateLiveTotal);

    updateAutoInfo();
    updateLiveTotal();

  function relationRecord(id){
    return state.consumption.find(item=>item.id===Number(id));
  }

  function relationRecordLabel(item){
    if(!item) return '—';
    return `${item.unitName}｜${item.energy}｜${item.dataType}｜${item.year}`;
  }

  function relationRecordOptions(selectedId='',types=[],allowNone=false,unitName=''){
    const candidates = state.consumption.filter(item=>
      (!types.length || types.includes(item.dataType)) &&
      (!unitName || item.unitName===unitName)
    );
    const none = allowNone
      ? `<option value="none" ${String(selectedId)==='none'?'selected':''}>不单独记录输入能源（如光伏、风电）</option>`
      : '<option value="">请选择已有能源数据</option>';
    return none + candidates.map(item=>`
      <option value="${item.id}" ${Number(selectedId)===item.id?'selected':''}>${escapeHtml(relationRecordLabel(item))}</option>
    `).join('');
  }

  function recordTce(item){
    if(!item) return 0;
    const energy = state.energy.find(row=>row.name===item.energy);
    if(!energy) return 0;
    const amount = recordAnnual(item);
    return String(energy.factorUnit||'').startsWith('kgce/')
      ? amount * Number(energy.factor||0) / 1000
      : amount * Number(energy.factor||0);
  }

  function relationStatus(item){
    const output = relationRecord(item.outputRecordId);
    if(!output) return {text:'待补充',className:'orange'};
    if(item.type==='能源转换或自产' && item.inputRecordId && item.inputRecordId!=='none' && !relationRecord(item.inputRecordId)){
      return {text:'待补充',className:'orange'};
    }
    return {text:'可用',className:''};
  }

  function relationEfficiency(item){
    if(item.type!=='能源转换或自产' || !item.inputRecordId || item.inputRecordId==='none') return null;
    const inputTce = recordTce(relationRecord(item.inputRecordId));
    const outputTce = recordTce(relationRecord(item.outputRecordId));
    return inputTce>0 ? outputTce/inputTce*100 : null;
  }

  function relationUnitName(item){
    const output=relationRecord(item.outputRecordId);
    if(item.type==='能源转换或自产') return output?.unitName || item.processUnit || '—';
    return output?.unitName || item.sourceUnit || '—';
  }

  function relationTargetText(item){
    return item.type==='能源转换或自产' ? '厂内使用' : '企业外部';
  }

  function relationInputText(item){
    if(item.type==='外部输出') return '—';
    if(!item.inputRecordId || item.inputRecordId==='none') return '无单独输入记录';
    return relationRecordLabel(relationRecord(item.inputRecordId));
  }

  function relationOutputText(item){
    return relationRecordLabel(relationRecord(item.outputRecordId));
  }

  function flowContent(){
    const f = state.filters.flows;
    const list = state.flows.filter(item=>{
      const input = relationRecord(item.inputRecordId);
      const output = relationRecord(item.outputRecordId);
      const relatedUnits = [relationUnitName(item),input?.unitName,output?.unitName].filter(Boolean);
      const searchText = [item.type,relationUnitName(item),relationTargetText(item),input?.energy,output?.energy,input?.unitName,output?.unitName].filter(Boolean).join(' ');
      return String(item.year)===String(f.year) &&
        (!f.type || item.type===f.type) &&
        (!f.unitName || relatedUnits.includes(f.unitName)) &&
        (!f.keyword || searchText.includes(f.keyword));
    });

    const rows=[];
    list.forEach(item=>{
      const index=state.flows.findIndex(row=>row.id===item.id);
      const detailOpen=state.flowDetailId===item.id;
      const status=relationStatus(item);
      rows.push(`
        <tr>
          <td><span class="tag ${item.type==='外部输出'?'orange':'blue'}">${escapeHtml(item.type)}</span></td>
          <td>${escapeHtml(relationUnitName(item))}</td>
          <td>${escapeHtml(relationInputText(item))}</td>
          <td>${escapeHtml(relationOutputText(item))}</td>
          <td>${escapeHtml(relationTargetText(item))}</td>
          <td><span class="tag ${status.className}">${status.text}</span></td>
          <td>
            <button class="btn-link detail-flow" data-id="${item.id}" type="button">${detailOpen?'收起引用':'查看引用'}</button>
            <button class="btn-link edit-flow" data-index="${index}" type="button">编辑</button>
            <button class="btn-link danger delete-flow" data-index="${index}" type="button">删除</button>
          </td>
        </tr>
      `);

      if(detailOpen){
        const input=relationRecord(item.inputRecordId);
        const output=relationRecord(item.outputRecordId);
        const efficiency=relationEfficiency(item);
        const monthly = output?.method==='月度填报';
        rows.push(`
          <tr class="detail-row"><td colspan="7"><div class="detail-panel">
            <div class="detail-head">
              <span>${item.type==='能源转换或自产'
                ? `${escapeHtml(input?.energy||'自然能源')} → ${escapeHtml(relationUnitName(item))} → ${escapeHtml(output?.energy||'待补充')} → 厂内使用`
                : `${escapeHtml(relationUnitName(item))} → ${escapeHtml(output?.energy||'待补充')} → 企业外部`}</span>
              <span>数据均引用已有能源数据，不在此处重复填报</span>
            </div>
            ${monthly?`<div class="detail-grid">
              ${Array.from({length:12},(_,idx)=>`
                <div class="detail-item">
                  <div class="detail-label">${idx+1}月</div>
                  <div class="detail-value">${item.type==='能源转换或自产' && input
                    ? `${optionalDisplay(input.m?.[idx])} ${escapeHtml(input.unit)} → `:''}${optionalDisplay(output?.m?.[idx])} ${escapeHtml(output?.unit||'')}</div>
                </div>
              `).join('')}
            </div>`:''}
            <div class="summary-line">
              ${input?`输入：<strong>${fmt(recordAnnual(input))}</strong> ${escapeHtml(input.unit)}　`:''}
              输出/外供：<strong>${fmt(recordAnnual(output))}</strong> ${escapeHtml(output?.unit||'')}
              ${efficiency!==null?`　折标转换效率：<strong>${fmt(efficiency,1)}%</strong>`:''}
            </div>
          </div></td></tr>
        `);
      }
    });

    return `
      ${toolbar(`
        <div class="field"><label for="flowYear">年度</label>
          <select id="flowYear">${selectOptions(['2026','2025'],f.year)}</select></div>
        <div class="field"><label for="flowTypeFilter">关系类型</label>
          <select id="flowTypeFilter">${selectOptions(['能源转换或自产','外部输出'],f.type,true)}</select></div>
        <div class="field"><label for="flowUnitFilter">相关用能单元</label>
          <select id="flowUnitFilter"><option value="">全部</option>${groupedUnitOptions(f.unitName)}</select></div>
        <div class="field search"><label for="flowKeyword">关键字</label>
          <input id="flowKeyword" value="${escapeHtml(f.keyword)}" placeholder="搜索能源、转换单元或来源"></div>
      `,'新增特殊能源关系')}
      <div class="notice">
        本页仅配置<strong>少数特殊关系</strong>：能源转换/自产和外部输出。普通能源分配由系统根据“能源消费”的归属范围自动形成，无需重复维护数值。
      </div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>关系类型</th><th>系统识别单元</th><th>输入数据</th><th>输出/外供数据</th>
          <th>去向</th><th>数据状态</th><th>操作</th>
        </tr></thead>
        <tbody>${rows.length?rows.join(''):tableEmpty(7)}</tbody>
      </table></div>${pagination(list.length)}
    `;

  function bindFlows(){
    $('#addBtn').addEventListener('click',()=>openFlowModal(null));
    $('#flowYear').addEventListener('change',event=>{state.filters.flows.year=event.target.value;renderRecords();});
    $('#flowTypeFilter').addEventListener('change',event=>{state.filters.flows.type=event.target.value;renderRecords();});
    $('#flowUnitFilter').addEventListener('change',event=>{state.filters.flows.unitName=event.target.value;renderRecords();});
    $('#flowKeyword').addEventListener('input',event=>{state.filters.flows.keyword=event.target.value;renderRecords();});

      });

  function openFlowModal(index){
    const current=index===null?null:state.flows[index];
    const initialType=current?.type||'能源转换或自产';
    const initialOutput=current?.outputRecordId??33;
    const initialOutputRecord=relationRecord(initialOutput);
    const initialUnit=initialOutputRecord?.unitName||'';
    const initialInput=current?.inputRecordId??34;

    openModal(index===null?'新增特殊能源关系':'编辑特殊能源关系',`
      <div class="form-grid">
        <div class="full">
          <label class="required">关系类型</label>
          <div class="choice-row">
            ${['能源转换或自产','外部输出'].map(type=>`

          <input id="flowTypeValue" type="hidden" value="${initialType}">

        </div>

        <div id="conversionFields" class="full">
          <div class="form-grid">
            <div>
              <label class="required" for="flowOutputRecord">产出能源数据</label>

            </div>

              <select id="flowInputRecord">${relationRecordOptions(initialInput,['能源消费','回收能源'],true,initialUnit)}</select>

            </div>
            <div class="full auto-info">
              <span>转换/生产单元：<strong id="flowAutoUnit">—</strong></span>
              <span>去向：<strong>厂内使用</strong></span>
              <span>分配方式：<strong>按能源消费归属自动形成</strong></span>
            </div>
          </div>
        </div>

        <div id="externalFields" class="full custom-row">
          <div class="form-grid">
            <div>
              <label class="required" for="flowExternalRecord">外供能源数据</label>
              <select id="flowExternalRecord">${relationRecordOptions(current?.outputRecordId??35,['外供能源'])}</select>
              <div class="help">来源单元由所选外供数据自动识别。</div>
            </div>
            <div class="auto-info" style="align-self:end">
              <span>来源单元：<strong id="flowAutoSource">—</strong></span>
              <span>去向：<strong>企业外部</strong></span>
            </div>
          </div>
        </div>

        <div class="auto-info">
          <span>关系预览：<strong id="flowPreview">—</strong></span>
          <span>数据状态：<strong id="flowDataStatus">—</strong></span>
        </div>

        <div class="full">
          <label for="flowRemark">备注</label>
          <textarea id="flowRemark" placeholder="选填，可说明数据来源或关系口径">${escapeHtml(current?.remark||'')}</textarea>
        </div>

        <div class="full notice" style="margin:0">
          本页只建立数据关系，不重复录入月度数值。未找到可引用数据时，请先通过数据导入或接口补充“自产能源、回收能源或外供能源”记录。
        </div>
      </div>
    `,()=>{
      const type=$('#flowTypeValue').value;
      let item;
      if(type==='能源转换或自产'){
        const outputId=Number($('#flowOutputRecord').value);
        const output=relationRecord(outputId);
        if(!outputId || !output) return alert('请选择产出能源数据。');
        const inputRaw=$('#flowInputRecord').value;
        const inputId=inputRaw==='none'?'none':Number(inputRaw);
        item={
          id:current?.id||nextId++,year:Number(state.filters.flows.year),type,
          processUnit:output.unitName,
          inputRecordId:inputId,outputRecordId:outputId,
          targetUnit:'厂内使用',
          remark:$('#flowRemark').value.trim()
        };
      }else{
        const outputId=Number($('#flowExternalRecord').value);
        const output=relationRecord(outputId);
        if(!outputId || !output) return alert('请选择外供能源数据。');
        item={
          id:current?.id||nextId++,year:Number(state.filters.flows.year),type,
          sourceUnit:output.unitName,
          outputRecordId:outputId,targetUnit:'外部',
          remark:$('#flowRemark').value.trim()
        };
      }
      const duplicate=state.flows.some((row,i)=>i!==index && row.type===item.type && row.outputRecordId===item.outputRecordId);

      const output=relationRecord($('#flowOutputRecord').value);

      $('#flowInputRecord').innerHTML=relationRecordOptions(old,['能源消费','回收能源'],true,output?.unitName||'');
      if(!Array.from($('#flowInputRecord').options).some(opt=>opt.value===old)) $('#flowInputRecord').value='none';
    };

    const syncFlow=()=>{
      const type=$('#flowTypeValue').value;
      $('#conversionFields').classList.toggle('custom-row',type!=='能源转换或自产');
      $('#externalFields').classList.toggle('custom-row',type!=='外部输出');
      if(type==='能源转换或自产'){
        const output=relationRecord($('#flowOutputRecord').value);
        const inputRaw=$('#flowInputRecord').value;
        const input=inputRaw==='none'?null:relationRecord(inputRaw);
        $('#flowAutoUnit').textContent=output?.unitName||'待选择';
        $('#flowPreview').textContent=`${input?.energy||'自然能源'} → ${output?.unitName||'转换/生产单元'} → ${output?.energy||'待选择'} → 厂内使用`;
        $('#flowDataStatus').textContent=output && (inputRaw==='none'||input) ? '可生成关系' : '待补充数据';
      }else{

        $('#flowAutoSource').textContent=output?.unitName||'待选择';
        $('#flowPreview').textContent=`${output?.unitName||'来源单元'} → ${output?.energy||'待选择'} → 企业外部`;
        $('#flowDataStatus').textContent=output ? '可生成关系' : '待补充数据';
      }
    };

    document.querySelectorAll('[data-flow-type]').forEach(button=>{
      button.addEventListener('click',()=>{
        document.querySelectorAll('[data-flow-type]').forEach(item=>item.classList.remove('active'));
        button.classList.add('active');
        $('#flowTypeValue').value=button.dataset.flowType;
        syncFlow();
      });
    });
    $('#flowOutputRecord').addEventListener('change',()=>{refreshInputOptions();syncFlow();});
    $('#flowInputRecord').addEventListener('change',syncFlow);
    $('#flowExternalRecord').addEventListener('change',syncFlow);
    refreshInputOptions();
    syncFlow();
  }

        <div class="auto-info">
          <span>计量单位：<strong id="operationAutoUnit">—</strong></span>
          <span>填报口径：<strong id="operationAutoMethod">—</strong></span>
        </div>
        <div id="annualValueWrap" class="full custom-row">
          <label class="required" for="annualValue">年度值</label>
          <input id="annualValue" type="number" min="0" step="0.01" value="${current?.annual ?? ''}" placeholder="请输入年度值"></div>
      </div>
      <div id="monthlyOperationWrap" class="custom-row">
        <div class="form-section-title">月度数据</div>${optionalMonthInputs(current?.m)}
        <div class="summary-line">当前合计：<strong id="operationLiveTotal">0</strong> <span id="operationTotalUnit"></span></div>
      </div>
    `,()=>{
      const category=$('#operationType').value;
      const selected=$('#operationMetric').value;
      const custom=selected==='其他（自定义）';
      const preset=operationPreset[category]?.[selected];
      const name=custom?$('#customMetricName').value.trim():selected;
      const unit=custom?$('#operationUnitValue').value.trim():preset.unit;
      const method=custom?$('#operationMethod').value:preset.method;
      const scope=$('#operationScope').value;
      const scopeItem=allUnits().find(item=>item.name===scope);
      if(!name) return alert('请填写指标名称。');
      if(!unit) return alert('请填写单位。');
      let months=[],annual=0;
      if(method==='月度填报'){
        months=readOptionalMonths();
        if(!months.some(value=>value!==null)) return alert('请至少填写一个月份的数据。');
      }else{
        const raw=$('#annualValue').value.trim();
        if(raw==='') return alert('请填写年度值。');
        annual=Number(raw);
      }
      const duplicate=state.operations.some((item,i)=>i!==index && String(item.year)==='2026' && item.unitName===scope && item.name===name);
      if(duplicate) return alert('该归属范围下已存在同名指标，请直接编辑原记录。');
      const item={id:current?.id||nextId++,year:2026,level:scopeItem?.level||'企业',
        unitName:scope,category,name,unit,method,
        aggregate:method==='月度填报'?'月度求和':'年度单值',annual,m:months};
      if(index===null) state.operations.push(item); else state.operations[index]=item;
      closeModal();renderOperations();toast('运营数据已保存');
    });

    const renderMetrics=(category,preferred='')=>{
      const metrics=Object.keys(operationPreset[category]||{});
      $('#operationMetric').innerHTML=metrics.map(name=>`<option ${name===preferred?'selected':''}>${escapeHtml(name)}</option>`).join('')+
        `<option ${preferred==='其他（自定义）'?'selected':''}>其他（自定义）</option>`;
      if(!preferred||![...metrics,'其他（自定义）'].includes(preferred)) $('#operationMetric').value=metrics[0]||'其他（自定义）';
      syncMetric();
    };
    const updateLiveTotal=()=>{
      const total=Array.from({length:12},(_,i)=>{const raw=$('#m'+i)?.value.trim()||'';return raw===''?0:Number(raw);}).reduce((a,b)=>a+b,0);
      $('#operationLiveTotal').textContent=fmt(total);
    };
    const syncMetric=()=>{
      const category=$('#operationType').value;
      const metric=$('#operationMetric').value;
      const custom=metric==='其他（自定义）';
      const preset=operationPreset[category]?.[metric];
      const unit=custom?($('#operationUnitValue').value||'待填写'):preset.unit;
      const method=custom?$('#operationMethod').value:preset.method;
      $('#customMetricWrap').classList.toggle('custom-row',!custom);
      $('#customUnitWrap').classList.toggle('custom-row',!custom);
      $('#customMethodWrap').classList.toggle('custom-row',!custom);
      $('#operationAutoUnit').textContent=unit;
      $('#operationAutoMethod').textContent=method==='月度填报'?'按月填报':'年度填报';
      $('#operationTotalUnit').textContent=unit;
      $('#monthlyOperationWrap').classList.toggle('custom-row',method!=='月度填报');
      $('#annualValueWrap').classList.toggle('custom-row',method!=='年度填报');
    };
    $('#operationType').addEventListener('change',event=>renderMetrics(event.target.value,''));
    $('#operationMetric').addEventListener('change',syncMetric);
    $('#operationMethod').addEventListener('change',syncMetric);
    $('#operationUnitValue').addEventListener('input',syncMetric);
    Array.from({length:12},(_,i)=>$('#m'+i)).forEach(input=>{if(input) input.addEventListener('input',updateLiveTotal);});
    renderMetrics(initialCategory,initialMetric);
    if(current && !currentIsPreset){$('#operationMethod').value=current.method;$('#operationUnitValue').value=current.unit;}
    syncMetric();updateLiveTotal();
  }

  /* =========================
     重点设备
  ========================== */

  function renderDevices(){
    const f=state.filters.devices;
    const list=state.devices.filter(item=>
      (!f.keyword||item.name.includes(f.keyword)||item.type.includes(f.keyword)) &&
      (!f.unitName||item.unitName===f.unitName) &&
      (!f.energy||item.energy===f.energy)
    );
    screen.innerHTML=`
      ${toolbar(`
        <div class="field search"><label for="deviceKeyword">关键字</label>
          <input id="deviceKeyword" value="${escapeHtml(f.keyword)}" placeholder="搜索设备名称或类型"></div>
        <div class="field"><label for="deviceUnitFilter">所属用能单元</label>
          <select id="deviceUnitFilter"><option value="">全部</option>${unitOptions(f.unitName,false)}</select></div>
        <div class="field"><label for="deviceEnergyFilter">主要能源品种</label>
          <select id="deviceEnergyFilter"><option value="">全部</option>${energyOptions(f.energy)}</select></div>
      `,'新增重点设备')}
      <div class="notice">一期仅维护设备基础档案，不在本页重复录入月度能耗；后续如需设备级计量，统一进入能源数据台账。</div>
      <div class="table-wrap"><table>
        <thead><tr><th>所属用能单元</th><th>设备名称</th><th>设备类型</th><th>主要能源品种</th><th>备注</th><th>操作</th></tr></thead>
        <tbody>${list.length?list.map(item=>{
          const index=state.devices.findIndex(row=>row.id===item.id);
          return `<tr><td>${escapeHtml(item.unitName)}</td><td>${escapeHtml(item.name)}</td>
            <td>${escapeHtml(item.type)}</td><td>${escapeHtml(item.energy)}</td>
            <td>${escapeHtml(item.remark||'—')}</td><td>${actionButtons(index)}</td></tr>`;
        }).join(''):tableEmpty(6)}</tbody>
      </table></div>${pagination(list.length)}
    `;
    $('#addBtn').addEventListener('click',()=>openDeviceModal(null));
    $('#deviceKeyword').addEventListener('input',event=>{state.filters.devices.keyword=event.target.value;renderDevices();});
    $('#deviceUnitFilter').addEventListener('change',event=>{state.filters.devices.unitName=event.target.value;renderDevices();});
    $('#deviceEnergyFilter').addEventListener('change',event=>{state.filters.devices.energy=event.target.value;renderDevices();});
    bindRowActions('devices',openDeviceModal,index=>{
      if(!confirm('确认删除该重点设备吗？')) return;
      state.devices.splice(index,1);renderDevices();toast('删除成功');
    });
  }

  function openDeviceModal(index){
    const current=index===null?null:state.devices[index];
    const isGeneric=genericDeviceTypes.slice(0,-1).includes(current?.type);
    const initialType=current?(isGeneric?current.type:'其他（自定义）'):genericDeviceTypes[0];
    openModal(index===null?'新增重点设备':'编辑重点设备',`
      <div class="form-grid">
        <div class="full"><label class="required" for="deviceUnitName">所属用能单元</label>
          <select id="deviceUnitName">${unitOptions(current?.unitName||state.units[0].children[0].name,false)}</select></div>
        <div><label class="required" for="deviceType">设备类型</label>
          <select id="deviceType">${selectOptions(genericDeviceTypes,initialType)}</select></div>
        <div id="customDeviceTypeWrap" class="${current && !isGeneric?'':'custom-row'}">
          <label class="required" for="customDeviceType">自定义设备类型</label>
          <input id="customDeviceType" value="${current && !isGeneric?escapeHtml(current.type):''}" placeholder="如：生料磨、水泥磨、回转窑"></div>
        <div><label class="required" for="deviceName">设备名称</label>
          <input id="deviceName" value="${escapeHtml(current?.name||'')}" placeholder="如：1号空压机"></div>
        <div><label class="required" for="deviceEnergy">主要能源品种</label>
          <select id="deviceEnergy">${energyOptions(current?.energy||'电力')}</select></div>
        <div class="full"><label for="deviceRemark">备注</label>
          <textarea id="deviceRemark" placeholder="选填">${escapeHtml(current?.remark||'')}</textarea></div>
      </div>
    `,()=>{
      const name=$('#deviceName').value.trim();
      const selectedType=$('#deviceType').value;
      const type=selectedType==='其他（自定义）'?$('#customDeviceType').value.trim():selectedType;
      if(!type) return alert('请填写设备类型。');
      if(!name) return alert('请填写设备名称。');
      const item={id:current?.id||nextId++,name,type,unitName:$('#deviceUnitName').value,
        energy:$('#deviceEnergy').value,remark:$('#deviceRemark').value.trim()};
      if(index===null) state.devices.push(item); else state.devices[index]=item;
      closeModal();renderDevices();toast('重点设备已保存');
    });
    const hints={'动力设备':'如：1号电机','泵类设备':'如：循环水泵1','风机设备':'如：窑尾高温风机',
      '空压设备':'如：1号空压机','制冷/空调设备':'如：中央空调主机1',
      '加热/锅炉设备':'如：燃气锅炉1','输送设备':'如：皮带输送机1',
      '其他（自定义）':'请输入具体设备名称'};
    const sync=()=>{
      const type=$('#deviceType').value;
      $('#customDeviceTypeWrap').classList.toggle('custom-row',type!=='其他（自定义）');
      $('#deviceName').placeholder=hints[type]||'请输入设备名称';
    };
    $('#deviceType').addEventListener('change',sync);sync();
  }

  /* =========================
     通用组件与事件
  ========================== */

  function monthInputs(values=[]){
    return `
      <div class="month-grid">
        ${Array.from({length:12},(_,index)=>`
          <div>
            <label class="required" for="m${index}">${index+1}月</label>
            <input id="m${index}" type="number" min="0" step="0.01" value="${values[index]??0}">
          </div>
        `).join('')}
      </div>
    `;
  }

  function readMonths(){
    return Array.from({length:12},(_,index)=>Number($('#m'+index).value||0));
  }

  function bindRowActions(key,editHandler,deleteHandler){
    document.querySelectorAll('.edit-row').forEach(button=>{
      button.addEventListener('click',()=>editHandler(Number(button.dataset.index)));
    });
    document.querySelectorAll('.delete-row').forEach(button=>{
      button.addEventListener('click',()=>deleteHandler(Number(button.dataset.index)));
    });
  }

  function openModal(title,body,onSave,small=false){
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = body;
    $('#modal').classList.toggle('small',small);
    state.saveHandler = onSave;
    overlay.classList.add('open');
  }

  function closeModal(){
    overlay.classList.remove('open');
    state.saveHandler = null;
  }

  $('#modalClose').addEventListener('click',closeModal);
  $('#modalCancel').addEventListener('click',closeModal);
  $('#modalSave').addEventListener('click',()=>{
    if(state.saveHandler) state.saveHandler();
  });
  overlay.addEventListener('click',event=>{
    if(event.target===overlay) closeModal();
  });

  document.querySelectorAll('.menu-item[data-page]').forEach(button=>{
    button.addEventListener('click',()=>{
      state.page = button.dataset.page;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
